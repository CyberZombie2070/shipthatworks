// ── ASSESSMENT ──
const assessAnswers = {};
function selectAssess(el, qIdx, optIdx) {
  const siblings = el.parentElement.querySelectorAll('.assess-opt');
  siblings.forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  assessAnswers[qIdx] = optIdx;
}

function scoreAssessment() {
  if (Object.keys(assessAnswers).length < 3) {
    alert('Please answer all three questions first.');
    return;
  }
  const score = Object.values(assessAnswers).reduce((a, b) => a + b, 0);
  const result = document.getElementById('assessResult');
  result.classList.add('show', 'honest');

  if (score <= 2) {
    result.innerHTML = `<h4>Your starting point: Strong base to build from</h4>
    <p>You have real coding literacy and self-awareness about what you know. The structured workflow modules (Phase 5) are your highest-value investment. Phases 2–4 are a useful calibration check — skim them and spend serious time on the modules that surface gaps.</p>`;
  } else if (score <= 4) {
    result.innerHTML = `<h4>Your starting point: The target learner for this course</h4>
    <p>You have functional experience with Claude Code but real gaps in the underlying literacy. This is exactly what this course is designed for. Don't skip Phase 2 or 3 — those gaps are actively costing you in code quality and team readiness. Work through them before Phase 5.</p>`;
  } else {
    result.innerHTML = `<h4>Your starting point: Honest and accurate — start at Phase 1</h4>
    <p>You've been flying on autopilot and you know it. That self-awareness is actually an advantage — you're not going to waste time defending habits that need to change. Work through every module in order. Don't skip the floor tests. They're the only way to verify the literacy is real, not theoretical.</p>`;
  }
}


// ─── STATE ────────────────────────────────────────────────────────────────────
let completedSet    = new Set(JSON.parse(localStorage.getItem('adf_done')    || '[]'));
let passedQuizzes   = new Set(JSON.parse(localStorage.getItem('adf_quizzes') || '[]'));
let currentModuleId = localStorage.getItem('adf_lastModule') || null;

const TOTAL = MODULES.length;

const TIME_MAP = {
  p1m1:'25 min',p1m2:'25 min',p1m3:'30 min',
  p2m1:'30 min',p2m2:'35 min',p2m3:'30 min',p2m4:'35 min',
  p3m1:'35 min',p3m2:'30 min',p3m3:'30 min',
  p4m1:'30 min',p4m2:'35 min',p4m3:'30 min',
  p5m1:'35 min',p5m2:'40 min',p5m3:'35 min',
  p6m1:'30 min',p6m2:'35 min',
};

const PHASE_META = {
  1:{name:'The Honest Reckoning',       color:'#d97706', time:'~1.3h'},
  2:{name:'JavaScript You Must Know',   color:'#2563eb', time:'~2.2h'},
  3:{name:'Node.js — Evaluate It',      color:'#16a34a', time:'~1.6h'},
  4:{name:'React — Evaluate It',        color:'#dc2626', time:'~1.6h'},
  5:{name:'Structured Workflow',        color:'#7c3aed', time:'~1.8h'},
  6:{name:'Working on a Real Team',     color:'#0891b2', time:'~1.1h'},
};

// ─── PROGRESS ─────────────────────────────────────────────────────────────────
function updateProgress() {
  const pct = TOTAL ? Math.round((completedSet.size / TOTAL) * 100) : 0;
  document.getElementById('tnProgFill').style.width = pct + '%';
  document.getElementById('tnProgText').textContent = completedSet.size + ' / ' + TOTAL;
  document.getElementById('tnPercent').textContent  = pct + '%';
  const hps = document.getElementById('hpsProgFill');
  if (hps) hps.style.width = pct + '%';
  const hpsLbl = document.getElementById('hpsLabel');
  if (hpsLbl) hpsLbl.textContent = completedSet.size + ' / ' + TOTAL + ' complete';
}

// ─── HOME / PHASE CARDS ───────────────────────────────────────────────────────
function buildPhaseCards() {
  const container = document.getElementById('phaseCards');
  if (!container) return;
  container.innerHTML = '';
  const phases = [...new Set(MODULES.map(m => m.phase))];
  phases.forEach(function(p) {
    const mods = MODULES.filter(m => m.phase === p);
    const done = mods.filter(m => completedSet.has(m.id)).length;
    const meta = PHASE_META[p] || {name:'Phase '+p, color:'#2563eb', time:''};
    const isComplete = done === mods.length;
    const isStarted  = done > 0;
    let statusHtml = '';
    if (isComplete) statusHtml = '<span class="phase-status complete">&#10003; Complete</span>';
    else if (isStarted) statusHtml = '<span class="phase-status in-progress">'+done+'/'+mods.length+'</span>';
    else statusHtml = '<span class="phase-status not-started">'+mods.length+' modules</span>';
    const card = document.createElement('div');
    card.className = 'phase-card';
    card.id = 'pc-'+p;
    const bg = meta.color+'18';
    card.innerHTML =
      '<div class="phase-card-header" onclick="togglePhaseCard('+p+')">' +
        '<div class="phase-num-badge" style="background:'+bg+';color:'+meta.color+'">P'+p+'</div>' +
        '<div class="phase-card-info">' +
          '<div class="phase-card-name">'+meta.name+'</div>' +
          '<div class="phase-card-meta">'+mods.length+' modules &nbsp;·&nbsp; '+meta.time+'</div>' +
        '</div>' +
        statusHtml +
        '<div class="phase-chevron">&#8250;</div>' +
      '</div>' +
      '<div class="phase-card-body">' +
        mods.map(function(m){
          return '<div class="module-row'+(completedSet.has(m.id)?' done':'')+'" onclick="showModuleView(\''+m.id+'\')">'+
            '<span class="module-row-num">'+m.num+'</span>'+
            '<span class="module-row-title">'+m.title+'</span>'+
            '<span class="module-row-time">'+(TIME_MAP[m.id]||'30 min')+'</span>'+
            (completedSet.has(m.id)?'<span class="module-row-check">&#10003;</span>':'')+
          '</div>';
        }).join('') +
      '</div>';
    container.appendChild(card);
  });
}

function togglePhaseCard(p) {
  const card = document.getElementById('pc-'+p);
  if (card) card.classList.toggle('open');
}

function showHome() {
  document.getElementById('homeView').style.display = '';
  document.getElementById('moduleView').style.display = 'none';
  closeMobileNav();
  buildPhaseCards();
  updateProgress();
}

// ─── MODULE VIEW ──────────────────────────────────────────────────────────────
function showModuleView(id) {
  const mod = MODULES.find(m => m.id === id);
  if (!mod) return;
  currentModuleId = id;
  localStorage.setItem('adf_lastModule', id);

  document.getElementById('homeView').style.display = 'none';
  document.getElementById('moduleView').style.display = 'flex';
  closeMobileNav();

  const bc = document.getElementById('breadcrumb');
  bc.innerHTML =
    '<a href="#" onclick="showHome();return false;">Home</a>' +
    '<span class="breadcrumb-sep"> &#8250; </span>' +
    '<span>Phase '+mod.phase+': '+(PHASE_META[mod.phase]||{name:mod.phaseName}).name+'</span>' +
    '<span class="breadcrumb-sep"> &#8250; </span>' +
    '<span>'+mod.num+'</span>';

  document.getElementById('moduleTimeBadge').textContent = TIME_MAP[id] || '30 min';

  const idx = MODULES.indexOf(mod);
  const phaseColor = (PHASE_META[mod.phase]||{color:'#2563eb'}).color;
  const bg     = phaseColor + '18';
  const border = phaseColor + '30';

  const quizHtml = mod.quiz ? buildQuizHtmlFnd(id, mod.quiz) : '';

  const contentCol = document.getElementById('moduleContentCol');
  contentCol.innerHTML =
    '<div class="mod-eyebrow">' +
      '<span class="phase-tag" style="background:'+bg+';color:'+phaseColor+';border-color:'+border+'">Phase '+mod.phase+' &nbsp;·&nbsp; '+(PHASE_META[mod.phase]||{name:mod.phaseName}).name+'</span>' +
      '<span class="mod-num-tag">'+mod.num+'</span>' +
    '</div>' +
    '<h1 class="mod-h1">'+mod.title+'</h1>' +
    '<p class="mod-lead">'+mod.lead+'</p>' +
    '<div class="mod-body">'+mod.content+'</div>' +
    quizHtml;

  contentCol.scrollTop = 0;
  buildOutline();

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (idx > 0) {
    prevBtn.style.display = '';
    prevBtn.onclick = function(){ showModuleView(MODULES[idx-1].id); };
    prevBtn.textContent = '\u2190 ' + MODULES[idx-1].num;
  } else {
    prevBtn.style.display = 'none';
  }
  if (idx < MODULES.length-1) {
    nextBtn.textContent = MODULES[idx+1].num + ' \u2192';
    nextBtn.onclick = function(){ showModuleView(MODULES[idx+1].id); };
  } else {
    nextBtn.textContent = '\u2190 Course Home';
    nextBtn.onclick = showHome;
  }

  updateCompleteBtn(id);
  updateProgress();

  document.querySelectorAll('.mobile-nav-item').forEach(n => n.classList.remove('active'));
  const mn = document.querySelector('.mobile-nav-item[data-id="'+id+'"]');
  if (mn) mn.classList.add('active');
}

function buildOutline() {
  const col   = document.getElementById('moduleContentCol');
  const items = document.getElementById('outlineItems');
  const hs    = col.querySelectorAll('.mod-body h3');
  items.innerHTML = '';
  const outlineCol = document.getElementById('moduleOutlineCol');
  if (!hs.length) { outlineCol.style.display = 'none'; return; }
  outlineCol.style.display = '';
  hs.forEach(function(h, i) {
    h.id = 'oh'+i;
    const item = document.createElement('div');
    item.className = 'outline-item';
    item.dataset.target = 'oh'+i;
    item.textContent = h.textContent;
    item.onclick = function(){ h.scrollIntoView({behavior:'smooth',block:'start'}); };
    items.appendChild(item);
  });
  if (window._outlineObs) window._outlineObs.disconnect();
  window._outlineObs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      const el = items.querySelector('[data-target="'+e.target.id+'"]');
      if (el) el.classList.toggle('active', e.isIntersecting);
    });
  }, { root: col, rootMargin: '-5% 0px -75% 0px' });
  hs.forEach(function(h){ window._outlineObs.observe(h); });
}

// ─── COMPLETION ───────────────────────────────────────────────────────────────
function updateCompleteBtn(id) {
  const btn = document.getElementById('completeBtn');
  const mod = MODULES.find(m => m.id === id);
  const hasQuiz = !!(mod && mod.quiz);
  const done = completedSet.has(id);
  if (done) {
    btn.textContent = '\u2713 Complete';
    btn.className = 'btn btn-complete done';
    btn.onclick = function(){ toggleDone(id); };
  } else if (hasQuiz && !passedQuizzes.has(id)) {
    btn.textContent = 'Pass the quiz first';
    btn.className = 'btn btn-complete locked';
    btn.onclick = null;
  } else {
    btn.textContent = 'Mark Complete';
    btn.className = 'btn btn-complete';
    btn.onclick = function(){ toggleDone(id); };
  }
}

function toggleDone(id) {
  if (completedSet.has(id)) completedSet.delete(id);
  else completedSet.add(id);
  localStorage.setItem('adf_done', JSON.stringify([...completedSet]));
  updateCompleteBtn(id);
  updateProgress();
  buildPhaseCards();
}

// ─── QUIZ ─────────────────────────────────────────────────────────────────────
function buildQuizHtmlFnd(modId, q) {
  return '<div class="quiz" id="qw-'+modId+'">' +
    '<div class="quiz-label">// knowledge check</div>' +
    '<div class="quiz-q">'+q.q+'</div>' +
    '<div class="quiz-opts" id="qopts-'+modId+'">' +
      q.opts.map(function(o,i){ return '<div class="quiz-opt" onclick="answerQ(\''+modId+'\','+i+')">'+o+'</div>'; }).join('') +
    '</div>' +
    '<div class="quiz-feedback" id="qfb-'+modId+'"></div>' +
  '</div>';
}

function answerQ(modId, chosen) {
  const mod = MODULES.find(m => m.id === modId);
  if (!mod || !mod.quiz) return;
  const q = mod.quiz;
  document.querySelectorAll('#qopts-'+modId+' .quiz-opt').forEach(function(o,i){
    o.classList.add('disabled');
    if (i === q.correct) o.classList.add('correct');
    else if (i === chosen) o.classList.add('wrong');
  });
  const fb = document.getElementById('qfb-'+modId);
  const ok = chosen === q.correct;
  fb.textContent = (ok ? '\u2713 ' : '\u2717 ') + (ok ? q.fb.c : q.fb.w);
  fb.className = 'quiz-feedback show ' + (ok ? 'c' : 'w');
  if (ok) {
    passedQuizzes.add(modId);
    localStorage.setItem('adf_quizzes', JSON.stringify([...passedQuizzes]));
    if (currentModuleId === modId) updateCompleteBtn(modId);
  }
}

// ─── MOBILE NAV ───────────────────────────────────────────────────────────────
function buildMobileNav() {
  const body = document.getElementById('mobileNavBody');
  let curPhase = 0;
  MODULES.forEach(function(mod) {
    if (mod.phase !== curPhase) {
      curPhase = mod.phase;
      const lbl = document.createElement('div');
      lbl.className = 'mobile-nav-phase';
      lbl.textContent = 'Phase '+mod.phase+' · '+mod.phaseName;
      body.appendChild(lbl);
    }
    const item = document.createElement('div');
    item.className = 'mobile-nav-item'+(completedSet.has(mod.id)?' done':'');
    item.dataset.id = mod.id;
    item.innerHTML = '<span class="mn-num">'+mod.num+'</span><span>'+mod.title+'</span>' +
      (completedSet.has(mod.id)?'<span class="mn-check">\u2713</span>':'');
    item.onclick = function(){ showModuleView(mod.id); };
    body.appendChild(item);
  });
}

function toggleMobileNav() {
  document.getElementById('mobileNav').classList.toggle('open');
  document.getElementById('mobileOverlay').classList.toggle('show');
}
function closeMobileNav() {
  document.getElementById('mobileNav').classList.remove('open');
  document.getElementById('mobileOverlay').classList.remove('show');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildPhaseCards();
buildMobileNav();
updateProgress();

if (currentModuleId && MODULES.find(function(m){ return m.id === currentModuleId; })) {
  showModuleView(currentModuleId);
}
</script>
