<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Dev Foundations — From Claude Code User to Team Developer</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg:         #f8fafc;
  --surface:    #ffffff;
  --surface2:   #f1f5f9;
  --border:     #e2e8f0;
  --border2:    #cbd5e1;
  --accent:     #2563eb;
  --accent-bg:  #eff6ff;
  --accent-dim: #93c5fd;
  --success:    #16a34a;
  --success-bg: #f0fdf4;
  --warn:       #d97706;
  --warn-bg:    #fffbeb;
  --danger:     #dc2626;
  --danger-bg:  #fef2f2;
  --text:       #1e293b;
  --text-muted: #64748b;
  --text-dim:   #94a3b8;
  --heading:    #0f172a;
  --code-bg:    #0f172a;
  --code-text:  #e2e8f0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  line-height: 1.65;
  padding-top: 56px;
}

/* ── TOPNAV ── */
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 200;
  display: flex; align-items: center; gap: 0;
  padding: 0 20px;
}
.tn-brand {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: inherit; flex-shrink: 0;
  cursor: pointer;
}
.tn-logo {
  width: 28px; height: 28px; background: var(--accent);
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
}
.tn-title {
  font-size: 13px; font-weight: 600; color: var(--heading);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
}
.tn-divider { width: 1px; height: 28px; background: var(--border); margin: 0 16px; flex-shrink: 0; }
.tn-progress { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.tn-prog-bar {
  flex: 1; height: 6px; background: var(--surface2);
  border-radius: 3px; overflow: hidden; min-width: 0;
}
.tn-prog-fill {
  height: 100%; background: var(--accent);
  border-radius: 3px; transition: width 0.4s ease; width: 0%;
}
.tn-stats {
  display: flex; gap: 6px; align-items: center;
  font-size: 12px; color: var(--text-muted); flex-shrink: 0; margin-left: 16px;
  font-variant-numeric: tabular-nums;
}
.tn-stat-sep { color: var(--border2); }
.tn-hamburger {
  display: none; margin-left: 12px; background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; cursor: pointer; color: var(--text-muted);
  font-size: 16px; line-height: 1;
}

/* ── MOBILE NAV OVERLAY ── */
.mobile-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 300;
}
.mobile-overlay.show { display: block; }
.mobile-nav {
  position: fixed; top: 0; right: 0; bottom: 0; width: 300px;
  background: var(--surface); border-left: 1px solid var(--border);
  z-index: 400; transform: translateX(100%); transition: transform .25s ease;
  display: flex; flex-direction: column; overflow: hidden;
}
.mobile-nav.open { transform: translateX(0); }
.mobile-nav-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.mobile-nav-hdr-title { font-weight: 600; font-size: 14px; }
.mobile-nav-close {
  background: none; border: none; cursor: pointer; font-size: 20px;
  color: var(--text-muted); padding: 2px 6px;
}
.mobile-nav-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.mobile-nav-phase {
  padding: 10px 20px 4px;
  font-size: 10px; font-weight: 600; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}
.mobile-nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 20px; cursor: pointer; font-size: 13px; color: var(--text-muted);
  border-left: 2px solid transparent; transition: all .12s;
}
.mobile-nav-item:hover { background: var(--accent-bg); color: var(--accent); }
.mobile-nav-item.active { border-left-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
.mobile-nav-item.done { color: var(--success); }
.mn-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); min-width: 26px; }
.mn-check { margin-left: auto; font-size: 11px; color: var(--success); }

/* ── HOME VIEW ── */
.home-view { min-height: calc(100vh - 56px); }
.home-container { max-width: 820px; margin: 0 auto; padding: 48px 24px 64px; }

.home-hero { margin-bottom: 48px; }
.home-eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 12px;
  font-family: 'JetBrains Mono', monospace;
}
.home-title {
  font-size: 36px; font-weight: 700; color: var(--heading);
  line-height: 1.15; margin-bottom: 8px;
}
.home-sub { font-size: 16px; color: var(--text-muted); margin-bottom: 20px; }
.home-meta {
  display: flex; gap: 8px; align-items: center;
  font-size: 13px; color: var(--text-dim);
}
.home-meta span { display: flex; align-items: center; }

.home-prog-summary {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 20px; margin-bottom: 32px;
  display: flex; align-items: center; gap: 16px;
}
.hps-bar { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.hps-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
.hps-label { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }

/* Phase cards */
.phase-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 12px; overflow: hidden;
  transition: box-shadow .15s;
}
.phase-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.phase-card-header {
  display: flex; align-items: center; gap: 14px;
  padding: 18px 20px; cursor: pointer; user-select: none;
}
.phase-num-badge {
  width: 36px; height: 36px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}
.phase-card-info { flex: 1; min-width: 0; }
.phase-card-name { font-size: 15px; font-weight: 600; color: var(--heading); }
.phase-card-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.phase-status {
  font-size: 11px; font-weight: 600; padding: 3px 10px;
  border-radius: 20px; flex-shrink: 0; font-family: 'JetBrains Mono', monospace;
}
.phase-status.complete { background: var(--success-bg); color: var(--success); }
.phase-status.in-progress { background: var(--accent-bg); color: var(--accent); }
.phase-status.not-started { background: var(--surface2); color: var(--text-dim); }
.phase-chevron {
  font-size: 18px; color: var(--text-dim); transition: transform .2s;
  flex-shrink: 0; line-height: 1;
}
.phase-card.open .phase-chevron { transform: rotate(90deg); }
.phase-card-body { display: none; border-top: 1px solid var(--border); }
.phase-card.open .phase-card-body { display: block; }
.module-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px 12px 26px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .1s; font-size: 13px;
}
.module-row:last-child { border-bottom: none; }
.module-row:hover { background: var(--accent-bg); }
.module-row.done { color: var(--text-dim); }
.module-row-num {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: var(--text-dim); min-width: 28px; flex-shrink: 0;
}
.module-row-title { flex: 1; color: var(--heading); }
.module-row.done .module-row-title { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--border2); }
.module-row-time { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.module-row-check { font-size: 12px; color: var(--success); margin-left: 4px; flex-shrink: 0; }

/* ── MODULE VIEW ── */
.module-view {
  height: calc(100vh - 56px);
  display: flex; flex-direction: column; overflow: hidden;
}
.module-hdr-bar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 32px; display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0;
}
.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; }
.breadcrumb a { color: var(--accent); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: var(--border2); }
.module-time-badge {
  font-size: 11px; color: var(--text-muted); background: var(--surface2);
  padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace;
}

.module-body-wrap { flex: 1; display: flex; overflow: hidden; min-height: 0; }
.module-content-col {
  flex: 65; min-width: 0; overflow-y: auto;
  padding: 48px 56px 80px 48px;
}
.module-outline-col {
  flex: 35; max-width: 300px; min-width: 220px;
  overflow-y: auto; height: 100%;
  border-left: 1px solid var(--border); padding: 28px 20px;
  background: var(--surface); flex-shrink: 0;
}

.mod-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.phase-tag {
  font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 4px;
  border: 1px solid; letter-spacing: .06em;
  font-family: 'JetBrains Mono', monospace;
}
.mod-num-tag { font-size: 11px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
.mod-h1 {
  font-size: 28px; font-weight: 700; color: var(--heading);
  line-height: 1.2; margin-bottom: 10px;
}
.mod-lead {
  font-size: 15px; color: var(--text-muted); max-width: 600px;
  line-height: 1.7; margin-bottom: 36px;
  padding-bottom: 28px; border-bottom: 1px solid var(--border);
}

/* Module content typography */
.mod-body h3 {
  font-size: 17px; font-weight: 600; color: var(--heading);
  margin: 32px 0 12px; padding-top: 4px;
}
.mod-body h4 { font-size: 14px; font-weight: 600; color: var(--heading); margin: 20px 0 8px; }
.mod-body p { margin-bottom: 14px; font-size: 14px; line-height: 1.75; color: var(--text); }
.mod-body ul, .mod-body ol { padding-left: 20px; margin-bottom: 16px; }
.mod-body li { font-size: 14px; line-height: 1.7; margin-bottom: 5px; color: var(--text); }
.mod-body strong { color: var(--heading); font-weight: 600; }
.mod-body em { font-style: italic; }
.mod-body code {
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  background: var(--surface2); padding: 2px 6px; border-radius: 4px;
  color: var(--accent); border: 1px solid var(--border);
}

/* Callouts */
.callout {
  border-radius: 8px; padding: 16px 20px; margin: 24px 0; border-left: 3px solid;
}
.callout-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
  letter-spacing: .15em; text-transform: uppercase; margin-bottom: 7px;
}
.callout p { font-size: 14px; margin-bottom: 0; line-height: 1.65; }
.callout.truth, .callout.callout-truth { background: var(--success-bg); border-color: var(--success); }
.callout.truth .callout-label { color: var(--success); }
.callout.warning, .callout.callout-warn, .callout.warn { background: var(--warn-bg); border-color: var(--warn); }
.callout.warning .callout-label, .callout.warn .callout-label { color: var(--warn); }
.callout.danger { background: var(--danger-bg); border-color: var(--danger); }
.callout.danger .callout-label { color: var(--danger); }
.callout.info { background: var(--accent-bg); border-color: var(--accent); }
.callout.info .callout-label { color: var(--accent); }

/* Code blocks */
.code-block {
  background: var(--code-bg); border: 1px solid #1e293b;
  border-radius: 8px; margin: 22px 0; overflow: hidden;
}
.code-header, .code-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 16px; border-bottom: 1px solid #1e293b;
  background: rgba(255,255,255,.04);
}
.code-label, .code-filename {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #64748b;
}
.code-dots { display: flex; gap: 5px; }
.code-dot, .cd { width: 9px; height: 9px; border-radius: 50%; }
.code-dot:nth-child(1), .cd:nth-child(1) { background: #ef4444; opacity: .7; }
.code-dot:nth-child(2), .cd:nth-child(2) { background: #f59e0b; opacity: .7; }
.code-dot:nth-child(3), .cd:nth-child(3) { background: #22c55e; opacity: .7; }
pre {
  padding: 18px 20px;
  font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
  line-height: 1.75; color: var(--code-text); overflow-x: auto; white-space: pre;
  background: var(--code-bg);
}
/* index.html syntax classes */
pre .comment { color: #475569; }
pre .key     { color: #93c5fd; }
pre .val     { color: #86efac; }
pre .str     { color: #fcd34d; }
pre .cmd     { color: #f87171; }
/* foundations.html syntax classes */
pre .c  { color: #475569; }
pre .k  { color: #93c5fd; }
pre .v  { color: #86efac; }
pre .s  { color: #fcd34d; }
pre .fn { color: #c4b5fd; }
pre .kw { color: #f87171; }

/* Comparison table */
.compare-table {
  width: 100%; border-collapse: collapse; margin: 22px 0; font-size: 13px;
}
.compare-table th {
  padding: 10px 14px; text-align: left;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--border);
}
.compare-table th:first-child { color: var(--danger); }
.compare-table th:last-child  { color: var(--success); }
.compare-table th:nth-child(2){ color: var(--text-dim); width: 18%; }
.compare-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  vertical-align: top; line-height: 1.5; color: var(--text); font-size: 13px;
}
.compare-table tr:last-child td { border-bottom: none; }
.compare-table td:first-child { color: var(--text-muted); }
.compare-table td:nth-child(2) { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: center; }

/* tbl (foundations) */
.tbl { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px; }
.tbl th {
  padding: 10px 14px; text-align: left; font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  border-bottom: 2px solid var(--border); color: var(--text-muted);
}
.tbl td {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  vertical-align: top; line-height: 1.6; color: var(--text); font-size: 13px;
}
.tbl tr:last-child td { border-bottom: none; }
.tbl td:first-child { color: var(--heading); font-weight: 500; }

/* Pair (foundations) */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
.pair-box { border-radius: 6px; overflow: hidden; }
.pair-label { padding: 7px 14px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: .1em; }
.pair-box.wrong .pair-label { background: #fef2f2; color: var(--danger); }
.pair-box.right .pair-label { background: var(--success-bg); color: var(--success); }
.pair-box pre { border-radius: 0; margin: 0; border-top: 1px solid #1e293b; }

/* Exercise */
.exercise {
  background: var(--accent-bg); border: 1px solid var(--accent-dim);
  border-radius: 8px; padding: 18px 22px; margin: 20px 0;
}
.exercise-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
  color: var(--accent); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 10px;
}
.exercise h4 { font-size: 14px; font-weight: 600; color: var(--heading); margin-bottom: 8px; }
.exercise p, .exercise li { font-size: 13px; color: var(--text); line-height: 1.65; }
.exercise ul, .exercise ol { padding-left: 18px; margin-top: 8px; }
.exercise li { margin-bottom: 4px; }

/* Floor test (foundations) */
.floor-test {
  background: var(--surface); border: 1px solid var(--warn);
  border-radius: 8px; padding: 22px 24px; margin: 28px 0;
}
.floor-test-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
  color: var(--warn); letter-spacing: .15em; text-transform: uppercase;
  margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}
.floor-test-label::before { content: '⬛'; font-size: 10px; }
.floor-test h4 { font-size: 15px; font-weight: 600; color: var(--heading); margin-bottom: 8px; }
.floor-test p { font-size: 14px; color: var(--text); margin-bottom: 10px; }
.floor-test ul { margin-bottom: 0; }
.floor-test li { font-size: 13px; }
.floor-test .pass-criteria { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.floor-test .pass-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--success);
  letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px;
}

/* Phase intro card (foundations) */
.phase-intro {
  background: linear-gradient(135deg, var(--accent-bg), var(--surface));
  border: 1px solid var(--accent-dim); border-radius: 10px;
  padding: 28px 32px; margin-bottom: 32px; position: relative; overflow: hidden;
}
.phase-intro::before {
  content: attr(data-num); position: absolute; right: 20px; top: 8px;
  font-size: 80px; font-weight: 700; color: rgba(37,99,235,.06);
  line-height: 1; pointer-events: none; font-family: 'Inter', sans-serif;
}
.phase-intro-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent);
  letter-spacing: .2em; text-transform: uppercase; margin-bottom: 8px;
}
.phase-intro h3 { font-size: 18px; margin-top: 0; margin-bottom: 10px; color: var(--heading); }
.phase-intro p { font-size: 14px; color: var(--text-muted); margin-bottom: 0; }

/* Lesson cards (index) */
.lesson-grid { display: grid; gap: 12px; margin: 24px 0; }
.lesson-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 18px 20px; cursor: pointer; transition: all .15s;
}
.lesson-card:hover { border-color: var(--accent); background: var(--accent-bg); }
.lesson-card.expanded { border-color: var(--accent); }
.lesson-card-header { display: flex; align-items: flex-start; gap: 14px; }
.lesson-icon { font-size: 18px; min-width: 26px; margin-top: 1px; }
.lesson-title { font-size: 14px; font-weight: 600; color: var(--heading); margin-bottom: 3px; }
.lesson-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
.lesson-expand {
  margin-left: auto; min-width: 18px; font-size: 16px; color: var(--text-dim);
  transition: transform .2s;
}
.lesson-card.expanded .lesson-expand { transform: rotate(45deg); color: var(--accent); }
.lesson-body { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.lesson-card.expanded .lesson-body { display: block; }
.lesson-body p { font-size: 13px; color: var(--text); line-height: 1.7; margin-bottom: 12px; }

/* Checklist - index.html (.check-box) */
.checklist { list-style: none; margin: 18px 0; }
.checklist li {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
  font-size: 14px; color: var(--text);
}
.checklist li:last-child { border-bottom: none; }
.check-box {
  width: 18px; height: 18px; min-width: 18px; border: 1.5px solid var(--border2);
  border-radius: 4px; margin-top: 2px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .15s;
  flex-shrink: 0;
}
.check-box:hover { border-color: var(--accent); }
.check-box.checked { background: var(--accent); border-color: var(--accent); }
.check-box.checked::after { content: '✓'; font-size: 11px; color: #fff; font-weight: 700; }

/* Checklist - foundations.html (.chk) */
.chk {
  width: 17px; height: 17px; min-width: 17px; border: 1.5px solid var(--border2);
  border-radius: 3px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; transition: all .15s; margin-top: 3px; flex-shrink: 0;
}
.chk:hover { border-color: var(--accent); }
.chk.on { background: var(--success); border-color: var(--success); }
.chk.on::after { content: '✓'; font-size: 10px; color: #fff; font-weight: 700; }

/* Quiz - index.html */
.quiz-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 24px; margin: 28px 0;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
.quiz-q { font-size: 15px; font-weight: 600; color: var(--heading); margin-bottom: 18px; line-height: 1.45; }

  lead:'Before any learning happens, you need an accurate map of your current position. Most people in your situation overestimate their understanding.',
  content:`
<div class="phase-intro" data-num="1">
  <div class="phase-intro-label">Phase 1 — The Honest Reckoning</div>
  <h3>Naming the gap so you can close it</h3>
  <p>Three modules. One goal: build an accurate, honest picture of what Claude Code has been hiding from you — and what that means for your work on a real team.</p>
</div>

<p>You have shipped things. That's real and it counts. But there's a difference between <strong>shipping with Claude Code</strong> and <strong>understanding what you shipped</strong>. On a solo side project that difference doesn't matter much. On a team, it's the difference between a trusted contributor and a liability.</p>

<div class="callout danger">
  <div class="callout-label">🚨 The False Confidence Trap</div>
  <p>Every time Claude Code produced working output you couldn't fully read, you got rewarded anyway — the app worked. Your brain logged that as a success. It wasn't. It was a success with an invisible risk. This course corrects that feedback loop.</p>
</div>

<h3>The Three Things You Need on a Team</h3>
<table class="tbl">
  <tr><th>Skill</th><th>What it means in practice</th></tr>
  <tr><td>Read code</td><td>Look at a diff and know if the logic is correct, not just if it compiles</td></tr>
  <tr><td>Explain code</td><td>Stand in a PR review and justify every line you're merging</td></tr>
  <tr><td>Debug code</td><td>When something breaks in production, trace the failure without AI assistance</td></tr>
</table>

<p>Claude Code makes writing code faster. It does not make reading, explaining, or debugging easier — those are still entirely on you. This course builds all three.</p>

<div class="callout truth">
  <div class="callout-label">✓ The Reframe</div>
  <p>You're not "learning to code." You're learning to be the engineer in the loop — the human whose judgment makes Claude Code output trustworthy. That's a higher bar than traditional coding, because you need to understand what the code does AND how to direct a powerful tool that can get it wrong at scale.</p>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 1.1 — Baseline Audit</div>
  <h4>Read your own code</h4>

    <li>What happens if the data coming in is null or undefined?</li>
    <li>Where could this fail silently without throwing an error?</li>
  </ul>

{

  num:'1.2', title:'How Claude Code Actually Works (No More Illusions)',
  lead:'Understanding the mechanism removes the magic — and the magical thinking that gets you into trouble.',
  content:`
<p>Claude Code is a large language model connected to your filesystem and a shell. It has no understanding of your codebase. It has no memory between sessions. It predicts what code should come next based on patterns in its training data and the context you give it. That's it.</p>

<h3>The Contractor Mental Model</h3>
<p>Imagine a supremely skilled contractor who:</p>
<ul>
  <li>Has read millions of codebases but has never worked in yours specifically</li>
  <li>Forgets everything at the end of each session</li>
  <li>Will do <em>exactly</em> what you say, including things that are wrong</li>
  <li>Will <em>also</em> helpfully do things you didn't ask for, because they seem related</li>
  <li>Cannot know your business rules, your team standards, or your production constraints unless you tell them explicitly</li>
</ul>

<div class="callout warn">
  <div class="callout-label">⚠ What this means for you specifically</div>
  <p>Every time you've gotten output you couldn't evaluate, you were accepting work from a contractor you couldn't inspect. The work might be perfect. It might have a subtle flaw that only surfaces under a specific condition three months from now. You had no way to know which.</p>
</div>

<h3>The Context Window — Why Sessions Drift</h3>
<p>Claude Code works within a fixed "context window" — a limited amount of text it can hold in working memory at once. In a long session:</p>
<ul>
  <li><strong>Early:</strong> Full fidelity. Every instruction is fresh and weighted.</li>
  <li><strong>Mid:</strong> Subtle drift. Earlier constraints get less weight.</li>
  <li><strong>Late:</strong> Real risk. The model may contradict its own earlier output or revert to generic patterns from training.</li>
</ul>

<p>This is why "just keep prompting until it works" is a dangerous habit. You may be in a degraded session without knowing it, producing output that quietly violates earlier decisions.</p>

<div class="callout info">
  <div class="callout-label">📋 Rule</div>
  <p>One logical unit of work per session. Commit it. Start fresh. Context integrity is more valuable than session momentum.</p>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 1.2 — Context Audit</div>
  <h4>Find evidence of drift in your own history</h4>
  <p>Look at a multi-session Claude Code project. Find one place where output from a later session quietly contradicts or ignores a decision from an earlier session. It might be a naming convention, an error handling pattern, or an architectural choice.</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can identify at least one example of drift and explain what context was missing in the session that produced it.</p>
  </div>
</div>
`},

{
  id:'p1m3', phase:1, phaseName:'The Honest Reckoning', dot:'dot-amber', badge:'badge-amber',
  num:'1.3', title:'What "Working on a Team" Actually Requires',
  lead:'Teams have standards, reviews, and accountability. This module makes those expectations concrete so you know exactly what you\'re building toward.',

<p>Solo projects are forgiving. If the code is messy, only you pay the price. On a team, every line you merge is debt or dividend for everyone. Understanding the team contract before you join one is how you avoid the most common failure mode: the developer who ships fast but leaves messes others have to clean up.</p>

<h3>What You'll Be Expected to Do</h3>
<table class="tbl">
  <tr><th>Activity</th><th>What it requires from you</th></tr>
  <tr><td>Submit a PR</td><td>Code that's tested, documented at the diff level, and explainable line by line</td></tr>
  <tr><td>Receive a review</td><td>Understand every piece of feedback — no "Claude wrote it" as a response</td></tr>
  <tr><td>Review someone else's PR</td><td>Evaluate logic correctness, not just whether it looks clean</td></tr>
  <tr><td>Debug a bug in your code</td><td>Trace the failure path in the code itself, not re-prompt Claude</td></tr>
  <tr><td>Discuss approach in standup</td><td>Explain what you built and why — in your own words</td></tr>
  <tr><td>On-call / incident response</td><td>Read logs, trace errors, fix production issues often without AI scaffolding</td></tr>
</table>

<div class="callout danger">
  <div class="callout-label">🚨 The Accountability Test</div>
  <p>"Claude Code wrote it" is not a valid answer in any of these situations. The moment you merge code into a shared repository, you are its author. Full stop. Your name is on the commit. You own it.</p>
</div>

<h3>The Good News</h3>
<p>You don't need to be able to write all of this from scratch. You need to be able to <strong>read, verify, explain, and debug it</strong>. That's a different — and achievable — bar. The rest of this course builds exactly that literacy.</p>

    <p>You can complete the explanation without referencing "Claude suggested" or "I'm not sure why but it works." If you can't, those exact gaps are your curriculum for Phase 2 and 3.</p>
  </div>
</div>

  content:`
<div class="phase-intro" data-num="2">
  <div class="phase-intro-label">Phase 2 — JavaScript You Must Know</div>
  <h3>The reading literacy that makes everything else possible</h3>
  <p>Four modules. Not a complete JS course — a targeted set of patterns you will see in every Node/React codebase and need to evaluate in Claude Code output.</p>
</div>

<h3>Variables and Scope — Why This Matters for Code Review</h3>
<p>When Claude Code refactors code, it often changes how variables are scoped. Getting this wrong causes bugs that only appear under certain conditions — the hardest kind to catch.</p>

<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">scope-patterns.js</div></div>
  <pre><span class="c">// const — value set once, cannot be reassigned</span>
<span class="kw">const</span> <span class="v">userId</span> = <span class="s">'abc123'</span>;   <span class="c">// this will never change</span>

<span class="c">// let — value can change, scoped to the block { }</span>
<span class="kw">let</span> <span class="v">isLoading</span> = <span class="kw">false</span>;
<span class="kw">if</span> (condition) {
  <span class="v">isLoading</span> = <span class="kw">true</span>;       <span class="c">// fine — changing let</span>
}

<span class="c">// WHY THIS MATTERS: if Claude changes const to let or vice versa
// without reason, that's a signal to ask why</span></pre>
</div>

<h3>Functions — The Three Forms You'll See</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">function-forms.js</div></div>
  <pre><span class="c">// Form 1: Named function declaration</span>
<span class="kw">function</span> <span class="fn">getUser</span>(id) {
  <span class="kw">return</span> db.find(id);
}

<span class="c">// Form 2: Arrow function (most common in modern code)</span>
<span class="kw">const</span> <span class="v">getUser</span> = (id) => {
  <span class="kw">return</span> db.find(id);
};

<span class="c">// Form 3: Shorthand arrow (implicit return, one line)</span>
<span class="kw">const</span> <span class="v">getUser</span> = (id) => db.find(id);

<span class="c">// All three do the same thing here.
// Claude Code may change between them. That's usually fine.
// Ask why if it changes a function that uses 'this' keyword.</span></pre>
</div>

<h3>Destructuring — What Claude Code Does All The Time</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">destructuring.js</div></div>
  <pre><span class="c">// Old way — Claude Code will often refactor this:</span>
<span class="kw">const</span> <span class="v">name</span> = user.name;
<span class="kw">const</span> <span class="v">email</span> = user.email;

<span class="c">// New way — destructuring (pulls values out of an object)</span>
<span class="kw">const</span> { <span class="v">name</span>, <span class="v">email</span> } = user;

<span class="c">// With a default value if the property doesn't exist:</span>
<span class="kw">const</span> { <span class="v">name</span>, <span class="v">role</span> = <span class="s">'user'</span> } = user;

<span class="c">// These are equivalent. Both are fine.
// Risk: if 'user' could be null/undefined, both will throw.</span></pre>
</div>

<div class="callout warn">
  <div class="callout-label">⚠ The Null Check Pattern</div>
  <p>Whenever you see destructuring in a diff, ask: <em>what happens if the object is null?</em> This is one of the most common sources of silent bugs in Claude Code output. Look for optional chaining (<code>user?.name</code>) or a guard clause before destructuring.</p>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 2.1 — Read 20 Lines</div>
  <h4>No running, no AI help</h4>
  <p>Open a JS file Claude Code produced. Find a function of 15–25 lines. Without running it, answer: What does it take in? What does it return? What happens if the first argument is undefined? Write your answers before checking.</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can answer all three for any function in the file. If you can't, re-read this module and spend 30 minutes reading through more JS examples before moving on.</p>
  </div>
</div>
`},

{
  id:'p2m2', phase:2, phaseName:'JavaScript You Must Know', dot:'dot-blue', badge:'badge-blue',
  num:'2.2', title:'Async/Await — The Pattern You See Everywhere',
  lead:'The majority of Node.js and React bugs involving Claude Code output come from async misuse. You need to understand this cold.',
  content:`
<p>Almost everything in a web application is asynchronous — database calls, API requests, file reads. JavaScript handles this with Promises and async/await syntax. Claude Code uses these constantly. Misunderstanding them is how silent bugs get into production.</p>

<h3>The Core Concept in Plain English</h3>
<p>Normally, code runs line by line and waits for each line to finish. Async code says: "start this, but don't block everything while you wait for it." <code>await</code> says: "wait here until this specific async thing is done before continuing."</p>

<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">async-basics.js</div></div>
  <pre><span class="c">// This function goes to a database and waits for the result</span>
<span class="kw">async function</span> <span class="fn">getUser</span>(id) {
  <span class="kw">const</span> <span class="v">user</span> = <span class="kw">await</span> db.findById(id);  <span class="c">// wait here</span>
  <span class="kw">return</span> user;
}

<span class="c">// COMMON BUG — forgetting await:</span>
<span class="kw">async function</span> <span class="fn">getUser</span>(id) {
  <span class="kw">const</span> <span class="v">user</span> = db.findById(id);  <span class="c">// ❌ user is a Promise, not a user!</span>
  <span class="kw">return</span> user.name;               <span class="c">// ❌ this will be undefined</span>
}</pre>
</div>

<h3>Error Handling in Async Code</h3>
<div class="pair">
  <div class="pair-box wrong">
    <div class="pair-label">❌ No error handling</div>
    <pre><span class="kw">async function</span> <span class="fn">deleteUser</span>(id) {
  <span class="kw">await</span> db.delete(id);
  <span class="kw">return</span> { success: <span class="kw">true</span> };
}
<span class="c">// If db.delete throws, the error
// propagates unhandled. Bad.</span></pre>
  </div>
  <div class="pair-box right">
    <div class="pair-label">✓ With error handling</div>
    <pre><span class="kw">async function</span> <span class="fn">deleteUser</span>(id) {
  <span class="kw">try</span> {
    <span class="kw">await</span> db.delete(id);
    <span class="kw">return</span> { success: <span class="kw">true</span> };
  } <span class="kw">catch</span> (err) {
    <span class="kw">throw new</span> <span class="fn">AppError</span>(<span class="s">'Delete failed'</span>, err);
  }
}</pre>
  </div>
</div>

<div class="callout danger">
  <div class="callout-label">🚨 The Pattern to Catch in Every Claude Code Diff</div>
  <p>When Claude Code adds or changes async functions, check: is every <code>await</code> inside a try/catch? Is the error being handled or just re-thrown? Is the error logging useful? These three checks catch 80% of the async bugs that make it to production.</p>
</div>

<h3>Parallel vs Sequential — A Common Claude Code "Improvement"</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">parallel.js</div></div>
  <pre><span class="c">// Sequential — each awaits the previous (slower but ordered)</span>
<span class="kw">const</span> <span class="v">user</span> = <span class="kw">await</span> getUser(id);
<span class="kw">const</span> <span class="v">orders</span> = <span class="kw">await</span> getOrders(id);

<span class="c">// Parallel — both start at the same time (faster)</span>
<span class="kw">const</span> [<span class="v">user</span>, <span class="v">orders</span>] = <span class="kw">await</span> Promise.all([
  getUser(id),
  getOrders(id)
]);

<span class="c">// Claude often "improves" sequential to parallel.
// This is usually fine. BUT: if orders depends on user data,
// parallel is wrong. Always check the dependency.</span></pre>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 2.2 — Async Audit</div>
  <h4>Find every async function in a file</h4>
  <p>In a Claude Code-generated Node.js file, find every <code>async</code> function. For each one: does it have a try/catch? If not, what happens when it fails? Write this down. This is the kind of review your team expects from you.</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can identify async functions on sight and explain what happens on failure — before running anything.</p>
  </div>
</div>
`},

{
  id:'p2m3', phase:2, phaseName:'JavaScript You Must Know', dot:'dot-blue', badge:'badge-blue',
  num:'2.3', title:'Modules, Imports, and Why Dependencies Matter',
  lead:'Every import is a dependency. Every dependency is a risk. Reading import statements tells you about the architecture — and what Claude Code might be quietly changing.',
  content:`
<p>In modern JavaScript, code is split into modules that import from each other. How files depend on each other is the architecture. Claude Code routinely reorganizes imports — and sometimes introduces import patterns that violate your project's structure without you noticing.</p>

<h3>Reading Import Statements</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">imports.js</div></div>
  <pre><span class="c">// External package — from node_modules</span>
<span class="kw">import</span> express <span class="kw">from</span> <span class="s">'express'</span>;
<span class="kw">const</span> express = <span class="fn">require</span>(<span class="s">'express'</span>);   <span class="c">// older CommonJS style</span>

<span class="c">// Internal file — relative path starting with ./ or ../</span>
<span class="kw">import</span> { getUser } <span class="kw">from</span> <span class="s">'./userService'</span>;

<span class="c">// Named import — pull one specific thing from a module</span>
<span class="kw">import</span> { useState, useEffect } <span class="kw">from</span> <span class="s">'react'</span>;

<span class="c">// Default import — take whatever the module exports as default</span>
<span class="kw">import</span> UserCard <span class="kw">from</span> <span class="s">'./UserCard'</span>;</pre>
</div>

<h3>The Architecture Violation Pattern</h3>
<p>Well-structured projects have rules about what can import from what. A UI component shouldn't directly import from a database layer. A route handler shouldn't contain business logic imports. Claude Code regularly violates these boundaries because it doesn't know your rules unless you tell it.</p>

<div class="callout warn">
  <div class="callout-label">⚠ What to Check in Every Diff</div>
  <p>When you review a Claude Code diff, check the import section first. Any new import is a new dependency. Ask: does this file have permission to depend on that module? Does this introduce a circular dependency? Does adding this package to package.json fit the project's philosophy?</p>
</div>

<h3>package.json — What's Actually Installed</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">package.json (excerpt)</div></div>
  <pre>{
  <span class="k">"dependencies"</span>: {
    <span class="k">"express"</span>: <span class="s">"^4.18.0"</span>,      <span class="c">// runs in production</span>
    <span class="k">"react"</span>: <span class="s">"^18.0.0"</span>
  },
  <span class="k">"devDependencies"</span>: {
    <span class="k">"vitest"</span>: <span class="s">"^1.0.0"</span>,         <span class="c">// test tools, not shipped to prod</span>
    <span class="k">"typescript"</span>: <span class="s">"^5.0.0"</span>
  }
}
<span class="c">// If Claude Code adds to dependencies: ask if it should be devDependencies.
// If it adds a package you've never heard of: look it up before merging.</span></pre>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 2.3 — Dependency Map</div>
  <h4>Draw your project's import graph</h4>
  <p>Pick three related files in a Claude Code project. For each, list what they import and what imports them. Sketch the dependency direction on paper. Now answer: does anything import in a direction that seems wrong? (e.g., a pure utility file importing a UI component?)</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can trace import relationships in a file and identify at least one potential architectural concern — or confirm everything looks correctly layered.</p>
  </div>
</div>
`},

{
  id:'p2m4', phase:2, phaseName:'JavaScript You Must Know', dot:'dot-blue', badge:'badge-blue',
  num:'2.4', title:'TypeScript: Reading Types Without Being a TypeScript Expert',
  lead:'You don\'t need to write TypeScript fluently. You need to read type annotations and understand what they\'re protecting against.',
  content:`
<p>Most production Node/React codebases use TypeScript. It adds type annotations to JavaScript that describe what shape data should be. Claude Code generates TypeScript. You need to read it well enough to catch when it's wrong or when types are being bypassed.</p>

<h3>Reading Type Annotations</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">types-basics.ts</div></div>
  <pre><span class="c">// A type definition — describes the shape of an object</span>
<span class="kw">type</span> <span class="fn">User</span> = {
  id: <span class="v">string</span>;
  name: <span class="v">string</span>;
  email: <span class="v">string</span>;
  role: <span class="s">'admin'</span> | <span class="s">'user'</span>;   <span class="c">// only these two values allowed</span>
};

<span class="c">// Function with typed parameters and return type</span>
<span class="kw">async function</span> <span class="fn">getUser</span>(id: <span class="v">string</span>): <span class="fn">Promise</span>&lt;<span class="fn">User</span> | <span class="kw">null</span>&gt; {
  <span class="c">// returns a User object OR null, wrapped in a Promise</span>
}

<span class="c">// Optional property — might or might not exist</span>
<span class="kw">type</span> <span class="fn">Order</span> = {
  id: <span class="v">string</span>;
  notes?: <span class="v">string</span>;   <span class="c">// the ? means this can be undefined</span>
};</pre>
</div>

<h3>The Two Red Flags to Spot in Every Diff</h3>
<div class="pair">
  <div class="pair-box wrong">
    <div class="pair-label">❌ Red flag: using "any"</div>
    <pre><span class="c">// 'any' disables type checking entirely
// Claude often uses this as a shortcut</span>
<span class="kw">function</span> <span class="fn">process</span>(data: <span class="kw">any</span>) {
  <span class="kw">return</span> data.user.name;
}
<span class="c">// If data has no .user, this throws at
// runtime — TypeScript won't catch it</span></pre>
  </div>
  <div class="pair-box right">
    <div class="pair-label">✓ Properly typed</div>
    <pre><span class="kw">type</span> <span class="fn">Input</span> = { user: { name: <span class="v">string</span> } };

<span class="kw">function</span> <span class="fn">process</span>(data: <span class="fn">Input</span>) {
  <span class="kw">return</span> data.user.name;
}
<span class="c">// TypeScript will now catch callers
// that pass the wrong shape</span></pre>
  </div>
</div>

<div class="callout danger">
  <div class="callout-label">🚨 Type Assertions — Claude's Other Shortcut</div>
  <p>Watch for <code>as SomeType</code> in Claude Code output — this is a type assertion that overrides TypeScript's judgment. It says "trust me, I know what this is." Sometimes it's valid. Often it's Claude bypassing a type error instead of fixing it. Every <code>as</code> assertion in a diff deserves a second look.</p>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 2.4 — Type Red Flag Hunt</div>
  <h4>Audit a TypeScript file for type bypasses</h4>
  <p>In a Claude Code TypeScript file, search for: <code>any</code>, <code>as </code>, and <code>// @ts-ignore</code>. For each one you find, understand why it's there. Is it a legitimate shortcut or is it hiding a type error that should be fixed?</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can explain what each type annotation in a function signature means and identify any type bypasses in the file.</p>
  </div>
</div>
`,
  quiz:{
    q:'Claude Code produces this TypeScript: `const user = response.data as User`. Should you be concerned?',
    opts:[
      'No — TypeScript type assertions are standard practice',
      'Yes — this tells TypeScript to trust us that data is a User, but if the API returns something unexpected, TypeScript won\'t catch it at runtime',
      'No — the "as" keyword validates the type before assigning',
      'Only if the User type uses "any" somewhere'
    ],
    correct:1,
    fb:{c:'Exactly right. Type assertions skip runtime validation — they only satisfy the compiler. If the API returns a different shape than User, this silently fails at runtime. A safer pattern is runtime validation with a library like zod, or an explicit check before the assertion.',
        w:'Type assertions don\'t validate anything at runtime — they only satisfy the TypeScript compiler during build. The danger is that production data doesn\'t always match the types we expect. This is a pattern worth questioning in any diff.'}
  }
},

  id:'p3m1', phase:3, phaseName:'Node.js — Evaluate It', dot:'dot-green', badge:'badge-green',
  num:'3.1', title:'Express Route Structure — Read Any Route Handler',
  lead:'Most Node.js backend work involves Express routes. You need to read them accurately, spot what\'s missing, and understand the flow.',
  content:`
<div class="phase-intro" data-num="3">
  <div class="phase-intro-label">Phase 3 — Node.js: Evaluate It</div>
  <h3>Enough Node.js to catch what Claude Code gets wrong</h3>
  <p>Three modules. Target: you can read any Express route, identify its risks, and verify that a Claude Code refactor preserved the original behavior.</p>
</div>

<h3>The Anatomy of an Express Route</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">users.route.ts</div></div>
  <pre><span class="c">// Route handler: GET /users/:id</span>
router.<span class="fn">get</span>(<span class="s">'/users/:id'</span>,
  authMiddleware,          <span class="c">// runs first — checks auth</span>
  <span class="kw">async</span> (req, res, next) => {
    <span class="kw">try</span> {
      <span class="kw">const</span> { <span class="v">id</span> } = req.params;         <span class="c">// from the URL</span>
      <span class="kw">const</span> { <span class="v">includeOrders</span> } = req.query; <span class="c">// from ?includeOrders=true</span>

      <span class="kw">const</span> <span class="v">user</span> = <span class="kw">await</span> userService.<span class="fn">getUser</span>(id);

      <span class="kw">if</span> (!user) {
        <span class="kw">return</span> res.<span class="fn">status</span>(404).<span class="fn">json</span>({ error: <span class="s">'Not found'</span> });
      }

      res.<span class="fn">json</span>(user);

    } <span class="kw">catch</span> (err) {
      <span class="fn">next</span>(err);   <span class="c">// passes error to error handling middleware</span>
    }
  }
);</pre>
</div>

<h3>The Four Questions for Every Route</h3>
<ul>
  <li><strong>Authentication:</strong> Is there auth middleware? If not, is this route meant to be public?</li>
  <li><strong>Input validation:</strong> Is <code>req.params</code>, <code>req.query</code>, and <code>req.body</code> being validated before use?</li>
  <li><strong>Error handling:</strong> Does every async path have a try/catch that calls <code>next(err)</code>?</li>
  <li><strong>Response completeness:</strong> Are all code paths sending a response? (A path with no <code>res.json()</code> hangs forever.)</li>
</ul>

<div class="callout danger">
  <div class="callout-label">🚨 The Missing Auth Check</div>
  <p>When Claude Code refactors a route, it may move middleware around or accidentally drop it. The most dangerous change is removing an <code>authMiddleware</code> call that was protecting a route. Always verify middleware order is preserved in any route diff.</p>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 3.1 — Route Audit</div>
  <h4>Answer the four questions for every route in a file</h4>
  <p>Open a routes file from a Claude Code project. For each route: answer all four questions above. Identify any route where the answer to any question is "I'm not sure" — those are your investigation targets.</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can answer all four questions for any route handler, and you can describe what would happen in each error and edge case.</p>
  </div>
</div>
`},

{
  id:'p3m2', phase:3, phaseName:'Node.js — Evaluate It', dot:'dot-green', badge:'badge-green',
  num:'3.2', title:'Services, Repositories, and Why the Layer Structure Exists',
  lead:'Real applications separate concerns into layers. Claude Code regularly violates this. You need to know what a violation looks like.',
  content:`
<p>Well-structured Node.js applications separate code into layers with specific jobs. This isn't bureaucracy — it's what makes code testable, debuggable, and maintainable by a team. When Claude Code collapses layers together, it's creating technical debt you'll pay for later.</p>

<h3>The Layer Model</h3>
<table class="tbl">
  <tr><th>Layer</th><th>Job</th><th>What it should NOT do</th></tr>
  <tr><td>Routes (<code>/api</code>)</td><td>Handle HTTP: parse request, call service, format response</td><td>Contain business logic or database queries</td></tr>
  <tr><td>Services (<code>/services</code>)</td><td>Business logic: rules, calculations, orchestration</td><td>Import from Express, format HTTP responses</td></tr>
  <tr><td>Repositories (<code>/db</code> or <code>/repos</code>)</td><td>Data access: read/write the database</td><td>Contain business logic or HTTP concerns</td></tr>
</table>

<div class="pair">
  <div class="pair-box wrong">
    <div class="pair-label">❌ Collapsed layers (Claude does this)</div>
    <pre><span class="c">// Route handler doing everything</span>
router.<span class="fn">post</span>(<span class="s">'/orders'</span>, <span class="kw">async</span> (req, res) => {
  <span class="kw">const</span> <span class="v">user</span> = <span class="kw">await</span> db.<span class="fn">query</span>(
    <span class="s">'SELECT * FROM users WHERE id = $1'</span>,
    [req.body.userId]
  );
  <span class="kw">if</span> (user.balance &lt; req.body.amount) {
    <span class="kw">return</span> res.<span class="fn">status</span>(400).<span class="fn">json</span>({error:<span class="s">'Insufficient'</span>});
  }
  <span class="c">// ... more business logic here</span>
});</pre>
  </div>
  <div class="pair-box right">
    <div class="pair-label">✓ Correct layer separation</div>
    <pre><span class="c">// Route: only HTTP concerns</span>
router.<span class="fn">post</span>(<span class="s">'/orders'</span>, <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> <span class="v">order</span> = <span class="kw">await</span> orderService.<span class="fn">create</span>(req.body);
    res.<span class="fn">status</span>(201).<span class="fn">json</span>(order);
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
});

<span class="c">// Service: business logic</span>
<span class="kw">async function</span> <span class="fn">create</span>(data) {
  <span class="kw">const</span> <span class="v">user</span> = <span class="kw">await</span> userRepo.<span class="fn">findById</span>(data.userId);
  <span class="kw">if</span> (user.balance &lt; data.amount) <span class="kw">throw new</span> <span class="fn">InsufficientFundsError</span>();
  <span class="kw">return</span> orderRepo.<span class="fn">create</span>(data);
}</pre>
  </div>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 3.2 — Layer Violation Hunt</div>
  <h4>Find the architecture violations</h4>
  <p>In a Claude Code Node.js project, find at least one example of: a route handler doing database queries directly, or a service importing from Express. Document what refactor would fix it and what the prompt would need to say.</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can identify layer violations in any file and describe the correct structure — without needing to write the corrected code from scratch.</p>
  </div>
</div>
`},

{
  id:'p3m3', phase:3, phaseName:'Node.js — Evaluate It', dot:'dot-green', badge:'badge-green',
  num:'3.3', title:'Environment Variables, Secrets, and What Claude Code Doesn\'t Know',
  lead:'Claude Code doesn\'t know what\'s secret. It will hardcode things, log things, and expose things if you don\'t watch for it.',
  content:`
<p>One of the highest-risk areas of any Claude Code session involving backend code is how it handles sensitive values. API keys, database passwords, JWT secrets — Claude Code has no way to know the difference between a regular string and a secret unless you tell it explicitly. And sometimes it gets it wrong even then.</p>

<h3>Environment Variables — The Correct Pattern</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">config.ts</div></div>
  <pre><span class="c">// Secrets come from environment variables, NEVER hardcoded</span>
<span class="kw">const</span> config = {
  jwtSecret: process.env.<span class="v">JWT_SECRET</span>,       <span class="c">// ✓ from environment</span>
  dbUrl:     process.env.<span class="v">DATABASE_URL</span>,      <span class="c">// ✓ from environment</span>
  apiKey:    <span class="s">'sk-abc123definitelyreal'</span>      <span class="c">// ❌ NEVER do this</span>
};

<span class="c">// Good practice: fail loudly if a required secret is missing</span>
<span class="kw">if</span> (!process.env.<span class="v">JWT_SECRET</span>) {
  <span class="kw">throw new</span> Error(<span class="s">'JWT_SECRET environment variable is required'</span>);
}</pre>
</div>

<div class="callout danger">
  <div class="callout-label">🚨 What Claude Code Might Do</div>
  <p>Claude Code may generate example values, placeholder secrets, or log statements that include sensitive data. It may also write error messages that expose internal paths, database schemas, or user data. Scan every diff for: string literals that look like credentials, <code>console.log</code> statements with request/response data, and error messages that include raw error objects.</p>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 3.3 — Security Scan</div>
  <h4>Audit for exposed secrets and over-logging</h4>
  <p>In a Claude Code backend project: search for any hardcoded strings that could be secrets, any <code>console.log</code> that includes user data or full error objects, and any error response that leaks internal information (stack traces, database errors, file paths).</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can identify all three categories of security concern in any backend file — and you understand why each one is a problem.</p>
  </div>
</div>

{
  id:'p4m1', phase:4, phaseName:'React — Evaluate It', dot:'dot-red', badge:'badge-red',
  num:'4.1', title:'Components and Props — The Mental Model for React Code',
  lead:'React has one core idea. Once you genuinely understand it, reading any component becomes tractable.',
  content:`
<div class="phase-intro" data-num="4">
  <div class="phase-intro-label">Phase 4 — React: Evaluate It</div>
  <h3>Enough React to evaluate component-level Claude Code work</h3>
  <p>Three modules. Target: you can read any React component, identify its data flow, spot common bugs, and evaluate whether a Claude Code refactor preserved component behavior.</p>
</div>

<p>React's core idea: <strong>UI is a function of data</strong>. You give a component data (props), it returns what to display. When the data changes, it re-renders. That's the entire model. Everything else is variations on this.</p>

<h3>Reading a Component</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">UserCard.tsx</div></div>
  <pre><span class="c">// Props type — defines what data this component accepts</span>
<span class="kw">type</span> <span class="fn">UserCardProps</span> = {
  user: { name: <span class="v">string</span>; email: <span class="v">string</span>; role: <span class="v">string</span> };
  onEdit: () => <span class="kw">void</span>;   <span class="c">// a function the parent passes in</span>
  isLoading?: <span class="v">boolean</span>;  <span class="c">// optional prop</span>
};

<span class="c">// The component — takes props, returns JSX</span>
<span class="kw">function</span> <span class="fn">UserCard</span>({ user, onEdit, isLoading = <span class="kw">false</span> }: <span class="fn">UserCardProps</span>) {
  <span class="kw">if</span> (isLoading) <span class="kw">return</span> &lt;<span class="fn">Spinner</span> /&gt;;

  <span class="kw">return</span> (
    &lt;<span class="fn">div</span>&gt;
      &lt;<span class="fn">h2</span>&gt;{user.name}&lt;/<span class="fn">h2</span>&gt;
      &lt;<span class="fn">p</span>&gt;{user.email}&lt;/<span class="fn">p</span>&gt;
      &lt;<span class="fn">button</span> onClick={onEdit}&gt;Edit&lt;/<span class="fn">button</span>&gt;
    &lt;/<span class="fn">div</span>&gt;
  );
}</pre>
</div>

<h3>The Four Questions for Every Component</h3>
<ul>
  <li><strong>What data does it need?</strong> (the props type)</li>
  <li><strong>What can go wrong with that data?</strong> (null, undefined, empty arrays)</li>
  <li><strong>What events does it fire?</strong> (onClick, onSubmit functions passed as props)</li>
  <li><strong>What does it render in each state?</strong> (loading, error, empty, populated)</li>
</ul>

<div class="callout warn">
  <div class="callout-label">⚠ The Missing State Case</div>
  <p>Claude Code often writes the happy path — the component with good data. It frequently omits: the loading state, the error state, the empty state, and the case where a required prop is undefined. In a code review, ask: what does this render when the API is slow? When it fails? When the list is empty?</p>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 4.1 — Component Audit</div>
  <h4>Answer the four questions for a real component</h4>
  <p>Pick a React component from a Claude Code project. Without running the app, answer all four questions. Then check: what happens if <code>user</code> is <code>null</code>? If <code>onEdit</code> is not passed? Write your answers before verifying.</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can answer all four questions for any component and predict what it renders in at least 3 different states.</p>
  </div>
</div>
`},

{
  id:'p4m2', phase:4, phaseName:'React — Evaluate It', dot:'dot-red', badge:'badge-red',
  num:'4.2', title:'useState and useEffect — Where Claude Code Makes Mistakes',
  lead:'These two hooks are in nearly every component. They\'re also where the most subtle bugs live.',
  content:`
<h3>useState — Reading State Variables</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">state-patterns.tsx</div></div>
  <pre><span class="c">// useState returns [currentValue, setterFunction]</span>
<span class="kw">const</span> [<span class="v">count</span>, <span class="fn">setCount</span>] = <span class="fn">useState</span>(0);
<span class="c">//     ↑ value    ↑ how to change it   ↑ initial value</span>

<span class="c">// Setting new state triggers a re-render</span>
<span class="fn">setCount</span>(count + 1);    <span class="c">// increment</span>
<span class="fn">setCount</span>(prev => prev + 1);  <span class="c">// safer pattern using previous value</span>

<span class="c">// Common Claude Code mistake: mutating state directly</span>
user.name = <span class="s">'New Name'</span>;     <span class="c">// ❌ Does NOT trigger re-render</span>
<span class="fn">setUser</span>({...user, name: <span class="s">'New Name'</span>}); <span class="c">// ✓ creates new object</span></pre>
</div>

<h3>useEffect — The Source of Most React Bugs</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">effect-patterns.tsx</div></div>
  <pre><span class="c">// Runs after every render — usually NOT what you want</span>
<span class="fn">useEffect</span>(() => { fetchUser(); });

<span class="c">// Runs once on mount — common for initial data fetch</span>
<span class="fn">useEffect</span>(() => { fetchUser(); }, []);  <span class="c">// empty deps array</span>

<span class="c">// Runs when userId changes</span>
<span class="fn">useEffect</span>(() => { <span class="fn">fetchUser</span>(userId); }, [userId]);
<span class="c">//                                            ↑ dependency array</span></pre>
</div>

<div class="callout danger">
  <div class="callout-label">🚨 The Dependency Array — Claude's Most Common React Mistake</div>
  <p>When Claude Code writes a <code>useEffect</code>, always scrutinize the dependency array. Missing a dependency causes stale data (using old values). Adding too many causes infinite loops (re-runs trigger state changes that trigger re-runs). Ask Claude to <strong>explain its reasoning</strong> for every dep array it writes — if the explanation isn't clear, the deps are probably wrong.</p>
</div>

<div class="pair">
  <div class="pair-box wrong">
    <div class="pair-label">❌ Infinite loop (Claude produces this)</div>
    <pre><span class="kw">const</span> [<span class="v">data</span>, <span class="fn">setData</span>] = <span class="fn">useState</span>({});

<span class="fn">useEffect</span>(() => {
  <span class="fn">fetchData</span>(data.id);
}, [data]);   <span class="c">// ❌ fetchData calls setData,
              // which changes data,
              // which triggers this effect again</span></pre>
  </div>
  <div class="pair-box right">
    <div class="pair-label">✓ Correct dependency</div>
    <pre><span class="kw">const</span> [<span class="v">data</span>, <span class="fn">setData</span>] = <span class="fn">useState</span>({});

<span class="fn">useEffect</span>(() => {
  <span class="kw">if</span> (data.id) <span class="fn">fetchData</span>(data.id);
}, [data.id]);  <span class="c">// ✓ only the specific
                // property we depend on</span></pre>
  </div>
</div>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 4.2 — Hook Audit</div>
  <h4>Review every useEffect in a component file</h4>
  <p>For each <code>useEffect</code>: describe in plain English when it runs, what it does, and whether the dependency array looks correct. Flag any that could cause an infinite loop or stale data issue.</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can describe the behavior of any useEffect from reading it — when it runs, when it doesn't, and what could go wrong.</p>
  </div>
</div>
`},

  id:'p4m3', phase:4, phaseName:'React — Evaluate It', dot:'dot-red', badge:'badge-red',
  num:'4.3', title:'Component Decomposition — Reading and Evaluating a Refactor',
  lead:'When Claude Code breaks a large component into smaller ones, here\'s how to evaluate whether it did it well or just moved the mess.',
  content:`
<p>Component decomposition is one of the most common Claude Code refactoring tasks. "Break this 800-line component into smaller pieces." Claude Code will do it. Whether it does it <em>correctly</em> — in a way that improves maintainability without breaking behavior — requires you to understand what makes a good component split.</p>

<h3>What Good Decomposition Looks Like</h3>
<ul>
  <li><strong>Single responsibility:</strong> Each component does one thing and the name says exactly what</li>
  <li><strong>Clear prop interfaces:</strong> The props a component accepts are the minimum needed — not a kitchen sink</li>
  <li><strong>No prop drilling:</strong> Data isn't passed through 3 levels of components that don't need it</li>
  <li><strong>Behavior preserved:</strong> Every state, every event handler, every edge case from the original still works</li>
</ul>

<h3>What Bad Decomposition Looks Like (Claude Does This)</h3>
<div class="callout danger">
  <div class="callout-label">🚨 The Cosmetic Split</div>
  <p>Claude Code sometimes splits components by visual sections rather than logical concerns — a "TopSection" and "BottomSection" component. This is cosmetic, not architectural. You've added components without reducing complexity. The test: can you explain what each new component's single responsibility is, independent of where it appears on screen?</p>
</div>

<table class="tbl">
  <tr><th>Symptom</th><th>What it means</th></tr>
  <tr><td>Component names describe location ("TopBar", "RightPanel")</td><td>Split by position, not responsibility</td></tr>
  <tr><td>New component has 15+ props</td><td>Probably doing too many things, or should be restructured differently</td></tr>
  <tr><td>Parent passes same prop to 3+ children</td><td>Consider context or lifting the state differently</td></tr>
  <tr><td>Component file is 400 lines after "decomposition"</td><td>The problem wasn't addressed, just moved</td></tr>
</table>

<div class="floor-test">
  <div class="floor-test-label">Floor Test 4.3 — Evaluate a Decomposition</div>
  <h4>Judge a Claude Code component split</h4>
  <p>Find a component in a Claude Code project that was split from a larger one. For each child component: state its single responsibility in one sentence. Count its props. Check whether it could exist independently or only makes sense in context of its parent. Rate the decomposition: was it an improvement or a cosmetic shuffle?</p>
  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>
    <p>You can evaluate a component decomposition and articulate specific reasons it is or isn't an improvement — not just whether it "looks cleaner."</p>
  </div>
</div>
`,
  quiz:{
    q:'Claude Code breaks a 600-line UserDashboard into: UserDashboardHeader, UserDashboardBody, UserDashboardSidebar, UserDashboardFooter. Is this good decomposition?',
    opts:[
      'Yes — smaller files are always better',
      'Maybe — it reduces file size, but splitting by position doesn\'t reduce complexity or clarify responsibility',
      'No — components should never be split from a parent like this',
      'Yes — as long as each component has well-defined props'
    ],
    correct:1,
    fb:{c:'Correct. Position-based naming is a code smell. What is the single responsibility of "UserDashboardBody"? It\'s whatever the dashboard body does — which is probably still a lot of things. Better splits would be UserProfileSummary, RecentActivityFeed, QuickActionsPanel — names that describe what the component *does*, not where it *is*.',
        w:'Smaller files feel better, but if the complexity just moved without being organized by responsibility, you\'ve added indirection without adding clarity. A team member reading these files for the first time still has no idea what each component\'s job is from the name alone.'}
  }

<div class="phase-intro" data-num="5">
  <div class="phase-intro-label">Phase 5 — Structured Claude Code Workflow</div>
  <h3>Using the tool with the literacy to use it right</h3>
  <p>Three modules. This is where your new code literacy combines with structured workflow discipline. The difference between Phase 5 now vs. before this course: you'll understand why every rule exists.</p>
</div>

<h3>CLAUDE.md — Your Persistent Engineering Contract</h3>
<p>CLAUDE.md sits in your project root. Claude Code reads it at the start of every session. It is the document that prevents you from having to re-explain your architecture, your rules, and your constraints every single time you start.</p>

<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">CLAUDE.md</div></div>
  <pre><span class="c"># Project: [Name] | Updated: [date]</span>

<span class="k">## Stack</span>
Express 4 + TypeScript strict + React 18 + React Query

<span class="k">## Layer Rules (enforce these without exception)</span>
- Routes: HTTP only — no DB imports, no business logic
- Services: Business logic — no Express imports
- Repos: DB access only — return plain objects, not HTTP responses

<span class="k">## Coding Rules</span>
- No 'any' type without a comment explaining why
- No 'as Type' assertions without a guard before it
- All async functions: try/catch with our AppError class
- No console.log — use logger.ts

<span class="k">## Security Rules</span>
- No secrets in code — environment variables only
- Auth middleware must remain on all /api/admin/* routes
- Never log req.body on auth routes

<span class="k">## NEVER touch without explicit instruction</span>
- /migrations
- /middleware/auth.ts
- package.json dependencies

<span class="k">## Current session goal</span>
<span class="v">← UPDATE THIS EVERY SESSION. One sentence. One task.</span></pre>
</div>

<div class="callout truth">
  <div class="callout-label">✓ Why this works now (but didn't before)</div>
  <p>Before this course, you could have written "no 'any' type" but you wouldn't have known what it meant to enforce. Now you do. The rule is only useful if the person writing it understands why it matters — and the person reviewing Claude's output can catch when it's violated.</p>
</div>

  <div class="pass-criteria">
    <div class="pass-label">Pass criteria</div>

<p>The gap between "vague prompt" and "surgical prompt" is not about vocabulary. It's about the prompter's understanding of the domain. You couldn't write a truly constrained prompt for a React hook refactor before because you didn't understand what a React hook does. Now you do.</p>

<h3>The Surgical Prompt Structure</h3>
<div class="code-block">
  <div class="code-top"><div class="code-dots"><div class="cd"></div><div class="cd"></div><div class="cd"></div></div><div class="code-filename">prompt-template.md</div></div>
  <pre><span class="k">[1. TASK — one sentence, verb-first]</span>
Extract the database query from getUser() in userService.ts
into a new getUserById() function in userRepository.ts.

<span class="k">[2. CONSTRAINTS — what must not change]</span>
- getUser() public signature must stay identical
- Return type User | null must be preserved
- Do not add error handling beyond what exists
- Do not touch any other function in userService.ts

<span class="k">[3. DEFINITION OF DONE — how you'll know it worked]</span>
- userService.ts no longer imports from /lib/db.ts
- userRepository.ts exports getUserById(id: string): Promise&lt;User | null&gt;
- All existing tests pass

<span class="k">[4. EXPLICIT SCOPE]</span>
Only modify: userService.ts, create: userRepository.ts
Do not touch: any other file</pre>
</div>

<h3>The Before/After Test</h3>
<p>After any Claude Code session on a refactor task, run this mental check:</p>
<ul>
  <li>Does the public interface look identical to what I specified?</li>
  <li>Did it touch any file I didn't list in scope?</li>
  <li>Can I trace a request from entry point to response and understand every step?</li>

  </div>
</div>

<div class="code-block">

Extracts the database query from userService into a new
userRepository layer. userService now has no direct DB imports.

<span class="k">## Why</span>
Needed for unit testing the service layer in isolation.
Follows the layer pattern established in orderService.

<span class="k">## What to focus on in review</span>

- That getUser() in userService.ts still handles null correctly
- That existing userService tests still pass (no behavior change)

<span class="k">## What I tested</span>
- All existing unit tests pass
- Manual test: GET /users/:id returns same response as before
- Manual test: GET /users/nonexistent still returns 404

  <p>Note that the template includes "Claude Code assisted." This is professional and appropriate. What it does NOT say is "Claude Code did this and I trust it." You reviewed every line. The AI assisted. You're the author. Own that distinction — it's what separates a trustworthy AI developer from a liability.</p>
