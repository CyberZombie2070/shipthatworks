<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Code Engineer — Ship That Works</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap');
:root{--bg:#0f1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--border2:#444c56;--accent:#e8c547;--success:#3fb950;--danger:#f85149;--warn:#d29922;--info:#58a6ff;--text:#c9d1d9;--text-dim:#8b949e;--heading:#f0f6fc;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.65;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:268px;min-width:268px;background:var(--surface);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;flex-shrink:0;}
.sb-top{padding:14px 14px 10px;border-bottom:1px solid var(--border);}
.sb-back{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);text-decoration:none;margin-bottom:10px;}
.sb-back:hover{color:var(--accent);}
.sb-title{font-size:13px;font-weight:600;color:var(--heading);line-height:1.35;margin-bottom:8px;}
.sb-prog-bar{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;}
.sb-prog-fill{height:100%;background:var(--accent);transition:width .4s ease;width:0%;}
.sb-stats{display:flex;justify-content:space-between;margin-top:5px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);}
.sb-nav{flex:1;padding:6px 0 16px;}
.sb-sect{padding:10px 14px 3px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:.15em;text-transform:uppercase;}
.phase-hdr{padding:8px 14px 3px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:5px;}
.ph-num{color:var(--accent);font-weight:700;}
.nav-item{display:flex;align-items:center;padding:5px 14px 5px 18px;font-size:12px;color:var(--text-dim);cursor:pointer;border-left:2px solid transparent;transition:all .15s;gap:3px;line-height:1.3;}
.nav-item:hover{color:var(--text);background:rgba(232,197,71,.04);}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(232,197,71,.07);}
.ni-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ni-done{color:var(--success);font-size:10px;flex-shrink:0;}
.ni-time{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);flex-shrink:0;margin-left:2px;}
.ni-bm{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:11px;padding:0 2px;flex-shrink:0;line-height:1;}
.ni-bm:hover,.ni-bm.on{color:var(--accent);}
.content-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 22px;height:50px;display:flex;align-items:center;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.tb-logo{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;}
.tb-div{width:1px;height:22px;background:var(--border);flex-shrink:0;}
.tb-course{font-size:13px;font-weight:600;color:var(--heading);flex-shrink:0;white-space:nowrap;}
.tb-prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0;}
.tb-bar{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;min-width:40px;}
.tb-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease;width:0%;}
.tb-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);flex-shrink:0;white-space:nowrap;}
.tb-btn{background:none;border:1px solid var(--border);border-radius:5px;color:var(--text-dim);cursor:pointer;padding:4px 9px;font-size:13px;flex-shrink:0;}
.tb-btn:hover{border-color:var(--accent);color:var(--accent);}
.tb-ham{display:none;background:none;border:1px solid var(--border);border-radius:5px;color:var(--text-dim);cursor:pointer;padding:4px 8px;font-size:14px;}
.main{flex:1;overflow-y:auto;}
.course-home{padding:44px 52px;}
.ch-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;}
.ch-title{font-size:34px;font-weight:700;color:var(--heading);line-height:1.15;margin-bottom:14px;}
.ch-title em{font-style:normal;color:var(--accent);}
.ch-sub{font-size:15px;color:var(--text-dim);max-width:520px;line-height:1.7;margin-bottom:26px;}
.ch-stats{display:flex;gap:26px;margin-bottom:36px;}
.chs-val{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--heading);}
.chs-val span{color:var(--accent);}
.chs-lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}
.ch-actions{display:flex;gap:10px;margin-bottom:44px;flex-wrap:wrap;}
.phase-cards{display:grid;gap:14px;}
.pc{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:border-color .15s;}
.pc:hover{border-color:var(--border2);}
.pc-badge{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:2px;flex-shrink:0;margin-top:2px;}
.pc-body{flex:1;min-width:0;}
.pc-title{font-size:14px;font-weight:600;color:var(--heading);margin-bottom:3px;}
.pc-desc{font-size:12px;color:var(--text-dim);line-height:1.5;}
.pc-mods{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:6px;}
.mod-view{display:none;}
.mod-bc{padding:12px 52px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;}
.mod-bc a{color:var(--text-dim);text-decoration:none;cursor:pointer;}
.mod-bc a:hover{color:var(--accent);}
.bc-sep{color:var(--border2);}
.bc-cur{color:var(--text);}
.audio-shell{padding:10px 52px;border-bottom:1px solid var(--border);background:var(--surface2);}
.audio-inner{height:38px;border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;padding:0 14px;gap:10px;opacity:.4;cursor:not-allowed;background:var(--surface);}
.audio-play{width:26px;height:26px;border:1px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--text-dim);}
.audio-bar{flex:1;height:3px;background:var(--border);border-radius:2px;}
.audio-time{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);}
.audio-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);margin-left:auto;}
.mod-tabs{padding:0 52px;border-bottom:1px solid var(--border);display:flex;}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;padding:11px 14px;margin-bottom:-1px;transition:all .15s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-pane{padding:36px 52px;}
.tab-pane.hidden{display:none;}
.mod-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.ptag{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--bg);background:var(--accent);padding:2px 7px;border-radius:2px;font-weight:700;}
.mnum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}
.tab-pane h2{font-size:25px;font-weight:700;color:var(--heading);margin-bottom:8px;line-height:1.25;}
.mod-lead{font-size:15px;color:var(--text-dim);margin-bottom:28px;max-width:600px;line-height:1.7;}
h3{font-size:17px;font-weight:600;color:var(--heading);margin:26px 0 10px;}
p{margin-bottom:12px;}
ul,ol{padding-left:20px;margin-bottom:12px;}
li{margin-bottom:6px;font-size:14px;color:var(--text);line-height:1.6;}
strong{color:var(--heading);font-weight:600;}
.callout{border-radius:6px;padding:14px 18px;margin:20px 0;border-left:3px solid;}
.callout.truth{background:rgba(63,185,80,.06);border-color:var(--success);}
.callout.warning{background:rgba(210,153,34,.07);border-color:var(--warn);}
.callout.danger{background:rgba(248,81,73,.07);border-color:var(--danger);}
.callout.info{background:rgba(88,166,255,.07);border-color:var(--info);}
.callout-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:5px;}
.callout.truth .callout-label{color:var(--success);}
.callout.warning .callout-label{color:var(--warn);}
.callout.danger .callout-label{color:var(--danger);}
.callout.info .callout-label{color:var(--info);}
.callout p{font-size:14px;color:var(--text);line-height:1.65;margin:0;}
.code-block{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin:18px 0;overflow:hidden;}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.2);}
.code-dots{display:flex;gap:5px;}
.code-dot{width:8px;height:8px;border-radius:50%;}
.code-dot:nth-child(1){background:var(--danger);opacity:.7;}
.code-dot:nth-child(2){background:var(--warn);opacity:.7;}
.code-dot:nth-child(3){background:var(--success);opacity:.7;}
.code-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);}
.copy-btn{background:none;border:1px solid var(--border);border-radius:3px;color:var(--text-dim);cursor:pointer;font-size:10px;padding:2px 7px;font-family:'JetBrains Mono',monospace;}
.copy-btn:hover{border-color:var(--accent);color:var(--accent);}
pre{padding:16px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:var(--text);overflow-x:auto;}
pre .comment{color:#8b949e;}pre .key{color:#79c0ff;}pre .val{color:var(--accent);}pre .str{color:#a5d6ff;}pre .cmd{color:var(--danger);}
.exercise{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.18);border-radius:6px;padding:16px 18px;margin:18px 0;}
.exercise-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--info);letter-spacing:.15em;text-transform:uppercase;margin-bottom:7px;}
.exercise h4{font-size:14px;font-weight:600;color:var(--heading);margin-bottom:7px;}
.exercise p,.exercise li{font-size:13px;color:var(--text);line-height:1.65;}
.exercise ul,.exercise ol{padding-left:16px;margin-top:7px;}
.compare-table{width:100%;border-collapse:collapse;margin:18px 0;font-size:13px;}
.compare-table th{padding:9px 13px;text-align:left;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--border);}
.compare-table th:first-child{color:var(--danger);}
.compare-table th:last-child{color:var(--success);}
.compare-table th:nth-child(2){color:var(--text-dim);width:18%;}
.compare-table td{padding:9px 13px;border-bottom:1px solid rgba(48,54,61,.4);vertical-align:top;line-height:1.5;}
.compare-table tr:last-child td{border-bottom:none;}
.compare-table td:first-child{color:var(--text-dim);}
.compare-table td:last-child{color:var(--text);}
.compare-table td:nth-child(2){color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:10px;text-align:center;}
.checklist{list-style:none;margin:16px 0;}
.checklist li{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid rgba(48,54,61,.4);font-size:14px;color:var(--text);}
.checklist li:last-child{border-bottom:none;}
.check-box{width:16px;height:16px;min-width:16px;border:1px solid var(--border);border-radius:3px;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.check-box:hover{border-color:var(--accent);}
.check-box.checked{background:var(--accent);border-color:var(--accent);}
.check-box.checked::after{content:"✓";font-size:10px;color:var(--bg);font-weight:700;}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:1px 6px;border-radius:3px;margin:0 2px;}
.tag.green{background:rgba(63,185,80,.12);color:var(--success);}
.tag.blue{background:rgba(88,166,255,.12);color:var(--info);}
.tag.red{background:rgba(248,81,73,.12);color:var(--danger);}
.tag.yellow{background:rgba(232,197,71,.12);color:var(--accent);}
.quiz-section{margin-top:32px;padding-top:24px;border-top:1px solid var(--border);}
.quiz-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:12px;}
.quiz-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:22px;}
.quiz-prog{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);margin-bottom:10px;}
.quiz-q-text{font-size:15px;font-weight:600;color:var(--heading);margin-bottom:16px;line-height:1.4;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.quiz-opt{padding:10px 13px;border:1px solid var(--border);border-radius:5px;cursor:pointer;font-size:13px;color:var(--text);transition:all .15s;line-height:1.4;}
.quiz-opt:hover{border-color:var(--accent);background:rgba(232,197,71,.05);}
.quiz-opt.correct{border-color:var(--success)!important;background:rgba(63,185,80,.08);color:var(--success);pointer-events:none;}
.quiz-opt.wrong{border-color:var(--danger)!important;background:rgba(248,81,73,.08);color:var(--danger);pointer-events:none;}
.quiz-opt.locked{pointer-events:none;}
.quiz-exp{display:none;font-size:13px;line-height:1.6;padding:11px 13px;border-radius:5px;margin-top:6px;}
.quiz-exp.show.correct{display:block;background:rgba(63,185,80,.08);color:var(--success);}
.quiz-exp.show.wrong{display:block;background:rgba(248,81,73,.08);color:#f08080;}
.quiz-next{display:none;margin-top:12px;}
.quiz-result{text-align:center;padding:8px 0 4px;}
.qr-score{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;margin-bottom:8px;}
.qr-score.pass{color:var(--success);}
.qr-score.fail{color:var(--danger);}
.qr-msg{color:var(--text-dim);font-size:14px;margin-bottom:18px;}
.qr-review{text-align:left;display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.rv-item{padding:10px 13px;border-radius:5px;border:1px solid;}
.rv-item.c{border-color:rgba(63,185,80,.3);background:rgba(63,185,80,.04);}
.rv-item.w{border-color:rgba(248,81,73,.3);background:rgba(248,81,73,.04);}
.rv-q{font-size:13px;font-weight:600;color:var(--heading);margin-bottom:4px;}
.rv-ans{font-size:12px;color:var(--text-dim);}
.rv-correct{font-size:12px;color:var(--success);}
.rv-exp{font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.5;}
.mod-footer{padding:24px 52px 44px;display:flex;gap:10px;border-top:1px solid var(--border);}
.btn{padding:8px 18px;border-radius:5px;border:none;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.04em;transition:all .15s;}
.btn-primary{background:var(--accent);color:var(--bg);}
.btn-primary:hover{background:#f0d060;}
.btn-primary:disabled{background:var(--border);color:var(--text-dim);cursor:not-allowed;}
.btn-secondary{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-complete{margin-left:auto;background:transparent;color:var(--text-dim);border:1px solid var(--border);}
.btn-complete:hover{border-color:var(--success);color:var(--success);}
.btn-complete.done{background:rgba(63,185,80,.1);color:var(--success);border-color:var(--success);}
.notes-ta{width:100%;min-height:260px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.65;padding:14px;resize:vertical;}
.notes-ta:focus{outline:none;border-color:var(--accent);}
.notes-meta{margin-top:7px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);display:flex;justify-content:space-between;}
.transcript-ph{padding:36px;text-align:center;border:1px dashed var(--border);border-radius:6px;color:var(--text-dim);font-size:14px;}
.overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;align-items:flex-start;justify-content:center;padding-top:80px;}
.overlay-bg.show{display:flex;}
.search-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:100%;max-width:540px;overflow:hidden;}
.search-input{width:100%;background:none;border:none;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:16px 18px;outline:none;}
.search-input::placeholder{color:var(--text-dim);}
.s-divider{height:1px;background:var(--border);}
.s-results{max-height:340px;overflow-y:auto;}
.s-hit{padding:10px 18px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
.s-hit:hover{background:var(--surface2);}
.sh-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);margin-top:2px;flex-shrink:0;}
.sh-title{font-size:14px;color:var(--heading);}
.sh-snip{font-size:12px;color:var(--text-dim);margin-top:1px;}
.s-empty{padding:22px 18px;color:var(--text-dim);font-size:14px;text-align:center;}
.cert-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:600;align-items:center;justify-content:center;}
.cert-ov.show{display:flex;}
.cert-modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:32px;width:100%;max-width:440px;text-align:center;}
.cert-modal h3{color:var(--heading);font-size:19px;margin-bottom:7px;}
.cert-modal p{color:var(--text-dim);font-size:14px;margin-bottom:18px;}
.cert-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:9px 13px;outline:none;margin-bottom:14px;}
.cert-input:focus{border-color:var(--accent);}
.cert-acts{display:flex;gap:10px;justify-content:center;}
.mob-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;}
.mob-ov.show{display:block;}
.mob-drawer{position:fixed;left:-268px;top:0;bottom:0;width:268px;background:var(--surface);border-right:1px solid var(--border);z-index:450;transition:left .25s ease;overflow-y:auto;}
.mob-drawer.show{left:0;}
@media(max-width:720px){.sidebar{display:none;}.tb-ham{display:block;}.course-home,.tab-pane{padding:24px 18px;}.mod-bc,.audio-shell,.mod-tabs,.mod-footer{padding-left:18px;padding-right:18px;}}
@media print{body>*:not(.cert-print-area){display:none!important;}.cert-print-area{display:block!important;position:fixed;inset:0;background:#fff;padding:60px;text-align:center;}}
.cert-print-area{display:none;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>
<div class="overlay-bg" id="searchOv" onclick="if(event.target===this)closeSearch()">
  <div class="search-box">
    <input class="search-input" id="searchIn" placeholder="Search modules…" oninput="runSearch(this.value)">
    <div class="s-divider"></div>
    <div class="s-results" id="searchRes"></div>
  </div>
</div>
<div class="cert-ov" id="certOv">
  <div class="cert-modal">
    <h3>&#127881; Course Complete</h3>
    <p>Enter your name to generate your certificate.</p>
    <input class="cert-input" id="certName" placeholder="Your full name">
    <div class="cert-acts">
      <button class="btn btn-secondary" onclick="closeCert()">Cancel</button>
      <button class="btn btn-primary" onclick="printCert()">Download PDF</button>
    </div>
  </div>
</div>
<div class="cert-print-area" id="certPrintArea">
  <h1 style="font-size:32px;color:#000;font-family:Georgia,serif;">Certificate of Completion</h1>
  <p style="font-size:18px;margin-top:20px;color:#333;">This certifies that</p>
  <h2 id="certRecipient" style="font-size:30px;margin:14px 0;color:#000;font-family:Georgia,serif;"></h2>
  <p style="font-size:16px;color:#333;">has completed</p>
  <h3 style="font-size:22px;margin:10px 0;color:#000;">AI Code Engineer with Claude Code</h3>

<script>

const TIME_MAP = {"p1m1":"25 min","p1m2":"20 min","p1m3":"25 min","p2m1":"30 min","p2m2":"25 min","p2m3":"20 min","p3m1":"35 min","p3m2":"30 min","p3m3":"30 min","p3m4":"30 min","p4m1":"40 min","p4m2":"35 min","p4m3":"35 min","p4m4":"30 min","p5m1":"30 min","p5m2":"25 min","p5m3":"25 min","p5m4":"40 min"};
const PHASE_META = [{"n":1,"name":"Mental Model","color":"#e8c547","mods":["p1m1","p1m2","p1m3"],"desc":"Understand what Claude Code actually is before you touch a single prompt."},{"n":2,"name":"Environment Setup","color":"#60a5fa","mods":["p2m1","p2m2","p2m3"],"desc":"Build the infrastructure that makes AI-assisted development safe and recoverable."},{"n":3,"name":"Prompt Engineering for Code","color":"#fb923c","mods":["p3m1","p3m2","p3m3","p3m4"],"desc":"Surgical prompts that produce surgical output."},{"n":4,"name":"The Refactor Workflow","color":"#f87171","mods":["p4m1","p4m2","p4m3","p4m4"],"desc":"A repeatable process for AI-assisted refactoring from recon to merged PR."},{"n":5,"name":"Production Grade","color":"#4ade80","mods":["p5m1","p5m2","p5m3","p5m4"],"desc":"Review standards, team norms, MCP safety, and the capstone playbook."}];
const MODULES = [{"id":"p1m1","phase":1,"phaseName":"Mental Model","num":"1.1","title":"The Magic Chatbox Problem","lead":"Before you touch a single prompt, you need to understand exactly what Claude Code is — and isn't.","content":"\n<p>Most developers approach Claude Code the same way they approach Google: type something vague, hope for something useful, and paste whatever comes back. This is the fastest path to an unmaintainable codebase and a false sense of productivity.</p>\n<div class=\"callout danger\"><div class=\"callout-label\">⚠ The Core Illusion</div><p>Claude Code doesn't understand your codebase. It builds a model of it from what you show it. The quality of that model is entirely determined by you. Bad input, bad output — at the speed of light.</p></div>\n<h3>What Claude Code Actually Is</h3>\n<p>Think of it as a highly capable, amnesiac contractor. Brilliant execution. Zero long-term memory. Every session, you are re-onboarding them from scratch. Your job is to be the best technical lead they've ever had.</p>\n<table class=\"compare-table\"><tr><th>What People Think</th><th>→</th><th>Reality</th></tr>\n<tr><td>\"It understands my project\"</td><td>→</td><td>It understands only what's in its context window right now</td></tr>\n<tr><td>\"It won't break things\"</td><td>→</td><td>It will confidently break exactly what you didn't mention</td></tr>\n<tr><td>\"I can trust its output\"</td><td>→</td><td>You can trust its syntax; you must verify its logic</td></tr>\n<tr><td>\"More detail = better results\"</td><td>→</td><td>Precise constraints = better results. Rambling = noise</td></tr>\n<tr><td>\"It's doing the work\"</td><td>→</td><td>You're directing. It's executing. The decision-making stays with you.</td></tr></table>\n<h3>The Correct Mental Model</h3>\n<p>You are the <strong>engineering lead</strong>. Claude Code is a <strong>senior IC who executes</strong> exactly what you specify, no more. The moment you abdicate that lead role — hoping it figures out intent from vague instructions — you've lost control of your codebase.</p>\n<div class=\"callout truth\"><div class=\"callout-label\">✓ The Rule</div><p>If you wouldn't be able to review Claude Code's output and verify it's correct, you don't understand the task well enough to delegate it yet. Understand first. Delegate second.</p></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 1.1</div><h4>The Constraint Inventory</h4><p>Pick a component or module in your current project. Before opening Claude Code, write down:</p><ol><li>What this code is supposed to do (one sentence)</li><li>What it must never do (at least 3 constraints)</li><li>What other code depends on it (interfaces)</li><li>How you would know if it's broken</li></ol><p>If you can't complete this in 10 minutes, you're not ready to let Claude Code touch it.</p></div>"},{"id":"p1m2","phase":1,"phaseName":"Mental Model","num":"1.2","title":"Context Window Fundamentals","lead":"The context window is your working memory budget. Burn it wrong and your session becomes unreliable.","content":"\n<p>Claude Code operates within a finite context window. Every file you reference, every instruction you give, every previous exchange — it all competes for the same limited space. As the window fills, older context gets deprioritized. This is the root cause of most \"Claude drifted halfway through\" complaints.</p>\n<h3>How Context Degrades</h3>\n<ul><li><strong>Early session:</strong> Full fidelity. Claude has sharp recall of all instructions.</li>\n<li><strong>Mid session:</strong> Subtle drift begins. Original constraints may be under-weighted.</li>\n<li><strong>Late session:</strong> Real risk of contradicting earlier decisions, ignoring edge cases you specified, or reverting to generic patterns.</li></ul>\n<div class=\"callout warning\"><div class=\"callout-label\">⚠ Warning Pattern</div><p>If you notice Claude Code producing output that feels \"generic\" or contradicts an earlier instruction — your context window is degraded. Start a new session, not a corrective prompt.</p></div>\n<h3>Practical Session Management</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">session-discipline.md</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre><span class=\"comment\"># Rules for long refactors</span>\n\n<span class=\"key\">Session size:</span>  <span class=\"val\">One logical unit of work per session</span>\n<span class=\"key\">Commit cadence:</span>  <span class=\"val\">Commit before ending each session</span>\n<span class=\"key\">Session start:</span>  <span class=\"val\">Always re-state your CLAUDE.md goals + current task</span>\n<span class=\"key\">Warning sign:</span>  <span class=\"val\">Any output that ignores a constraint = new session</span>\n<span class=\"key\">Never:</span>  <span class=\"val\">Continue a session after noticing drift</span></pre></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 1.2</div><h4>Session Boundary Practice</h4><p>Take a medium-sized refactor task. Break it into discrete session-sized chunks where each chunk: (1) has one clear deliverable, (2) can be committed independently, (3) can be verified correct without the others. If you can't break it down this way, the scope is too large.</p></div>"},{"id":"p1m3","phase":1,"phaseName":"Mental Model","num":"1.3","title":"Ownership vs. Delegation","lead":"The hardest skill: knowing exactly which decisions you must own and which you can safely delegate.","content":"\n<p>New AI developers make one of two mistakes: they either delegate nothing (making Claude Code a fancy autocomplete) or they delegate everything (including decisions that require engineering judgment). Both are wrong.</p>\n<h3>The Delegation Matrix</h3>\n<table class=\"compare-table\"><tr><th>Safe to Delegate</th><th></th><th>You Must Own</th></tr>\n<tr><td>Boilerplate generation</td><td>→</td><td>Architectural decisions</td></tr>\n<tr><td>Syntax transformation (class → hooks)</td><td>→</td><td>Data flow and state ownership</td></tr>\n<tr><td>Type annotation</td><td>→</td><td>Security-sensitive logic</td></tr>\n<tr><td>Test scaffolding</td><td>→</td><td>Edge case identification</td></tr>\n<tr><td>Import reorganization</td><td>→</td><td>Performance tradeoffs</td></tr>\n<tr><td>Formatting and style consistency</td><td>→</td><td>Race conditions and async behavior</td></tr>\n<tr><td>Repetitive pattern application</td><td>→</td><td>Business logic correctness</td></tr></table>\n<div class=\"callout danger\"><div class=\"callout-label\">🚨 Hard Rule</div><p>If getting it wrong would be a security issue, a data loss issue, or a production incident — you write it yourself or review it line-by-line with the same scrutiny you'd apply to an untrusted PR. No exceptions.</p></div>\n<h3>The \"Can I Review This?\" Test</h3>\n<p>Before delegating any task, ask yourself: <em>If Claude Code produces output for this, can I review it and confidently say it's correct?</em> If the answer is no — you need to either learn the domain first or break the task into smaller pieces you can actually evaluate.</p>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 1.3</div><h4>Build Your Delegation Map</h4><p>List 10 specific tasks from your current project. Categorize each as: <span class=\"tag green\">DELEGATE</span> <span class=\"tag yellow\">DELEGATE + REVIEW</span> <span class=\"tag red\">OWN</span>. For every \"DELEGATE + REVIEW\" item, define what \"reviewed correctly\" means before you start.</p></div>"},{"id":"p2m1","phase":2,"phaseName":"Environment Setup","num":"2.1","title":"CLAUDE.md — Your Engineering Contract","lead":"CLAUDE.md is the most important file in an AI-augmented project. Most people don't write one. The ones who do write bad ones.","content":"\n<p>CLAUDE.md is a file in your project root that Claude Code reads at the start of every session. It is your persistent instruction set — the thing that stops Claude Code from reinventing your architecture every session because you forgot to mention your conventions again.</p>\n<div class=\"callout truth\"><div class=\"callout-label\">✓ What CLAUDE.md Actually Does</div><p>It is a contract between you and the model. Every decision you've already made that Claude should never question or override. The more specific and enforceable, the more value it provides.</p></div>\n<h3>A Production-Grade CLAUDE.md</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">CLAUDE.md — complete template</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre><span class=\"comment\"># Project: [Name]\n# Last updated: [date]</span>\n\n<span class=\"key\">## Architecture</span>\n- Express API (Node 20+) + React 18 SPA\n- State: React Query for server state, Zustand for UI state\n- Styling: Tailwind only — no CSS-in-JS, no inline styles\n- Auth: JWT via httpOnly cookie — never localStorage\n\n<span class=\"key\">## Folder Structure (do not change)</span>\n- /api — Express routes and middleware only\n- /services — business logic, no Express imports\n- /hooks — React hooks, no direct API calls\n- /components — presentational only, no data fetching\n\n<span class=\"key\">## Coding Rules</span>\n- TypeScript strict mode — no 'any'\n- All async functions must have explicit error handling\n- No console.log in production paths — use logger.ts\n- Tests must exist before refactoring a function\n\n<span class=\"key\">## NEVER</span>\n- Touch /migrations without explicit instruction\n- Change the auth middleware\n- Add dependencies without listing them for approval\n\n<span class=\"key\">## Current Session Goal</span>\n<span class=\"val\">[UPDATE THIS EACH SESSION]</span></pre></div>\n<h3>The Single Most Important Line</h3>\n<p>The \"Current Session Goal\" at the bottom. Update it every time you open a new session. This prevents Claude from helpfully solving problems you didn't ask it to solve.</p>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 2.1</div><h4>Write Your CLAUDE.md</h4><p>For your current project, write a CLAUDE.md that includes: architecture overview, folder structure contract, at least 5 hard coding rules, and a NEVER section. Show it to a teammate and ask: \"Would you know exactly what Claude is and isn't allowed to do?\" If they hesitate, rewrite it.</p></div>"},{"id":"p2m2","phase":2,"phaseName":"Environment Setup","num":"2.2","title":"Git as Your Safety Net","lead":"Your git strategy determines how badly an AI session can hurt you. Set this up wrong and you lose the ability to recover.","content":"\n<p>AI-assisted development is high-velocity. You can generate changes across 50 files in 10 minutes. Without a deliberate git strategy, a single session can leave you unable to safely rollback, review, or explain what changed.</p>\n<h3>The AI-Dev Branch Strategy</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">terminal</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre><span class=\"comment\"># Before every Claude Code session</span>\n<span class=\"cmd\">git checkout -b</span> <span class=\"val\">ai/refactor-auth-middleware</span>\n\n<span class=\"comment\"># Checkpoint commits — after each logical unit</span>\n<span class=\"cmd\">git add -p</span>  <span class=\"comment\"># interactive staging — review every hunk</span>\n<span class=\"cmd\">git commit -m</span> <span class=\"str\">\"refactor(auth): extract token validation [ai-assisted]\"</span>\n\n<span class=\"comment\"># If session goes wrong — full rollback</span>\n<span class=\"cmd\">git checkout</span> main\n<span class=\"cmd\">git branch -D</span> ai/refactor-auth-middleware\n\n<span class=\"comment\"># If session is good — squash before merging</span>\n<span class=\"cmd\">git rebase -i</span> main</pre></div>\n<div class=\"callout warning\"><div class=\"callout-label\">⚠ Non-Negotiable Rule</div><p>Always use <code>git add -p</code> (patch mode) — never <code>git add .</code> — when committing AI-assisted changes. This forces you to read every diff hunk before it enters your commit history. This is not optional.</p></div>\n<h3>Commit Message Convention</h3>\n<p>Tag AI-assisted commits. Your team deserves to know what to scrutinize more carefully in review. Use a consistent marker like <span class=\"tag blue\">[ai]</span> or <span class=\"tag blue\">[ai-assisted]</span> in commit messages.</p>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 2.2</div><h4>Refactor One Function with Full Git Discipline</h4><p>Pick a single utility function. Create a branch. Use Claude Code to refactor it. Use <code>git add -p</code> to stage. Write a proper commit message. Then self-review the diff as if you were a senior dev reviewing an untrusted contributor's PR.</p></div>"},{"id":"p2m3","phase":2,"phaseName":"Environment Setup","num":"2.3","title":"The Test Harness First Principle","lead":"Refactoring without tests is not refactoring. It's rewriting while pretending you have a safety net.","content":"\n<p>This principle is not new. What is new is that AI-assisted refactoring at scale makes violating it catastrophic. Claude Code will happily restructure your entire Express API without tests. It'll look correct. It might not be.</p>\n<h3>Characterization Tests: Your First Move on Legacy Code</h3>\n<p>Before touching a single line of legacy code, write tests that document current behavior — including behavior that might be bugs. These are called characterization tests. Their job is not to verify correctness. Their job is to tell you when anything changes.</p>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">legacy/userService.test.ts</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre><span class=\"comment\">// Not saying this behavior is CORRECT.\n// Saying: tell us if it CHANGES.</span>\ndescribe(<span class=\"str\">'userService.getUser — current behavior'</span>, () => {\n  it(<span class=\"str\">'should return null for unknown id (not throw)'</span>, async () => {\n    const result = await userService.getUser(<span class=\"str\">'nonexistent'</span>);\n    expect(result).toBeNull();\n  });\n  it(<span class=\"str\">'should return user without password field'</span>, async () => {\n    const user = await userService.getUser(testUserId);\n    expect(user).not.toHaveProperty(<span class=\"str\">'password'</span>);\n  });\n});</pre></div>\n<div class=\"callout truth\"><div class=\"callout-label\">✓ The Rule for AI Refactors</div><p>Characterization tests before the refactor. All green after the refactor. Any red test = the refactor changed observable behavior. Investigate before merging.</p></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 2.3</div><h4>Characterize Before You Refactor</h4><p>Pick an untested Express route handler or React component. Use Claude Code to help write characterization tests for its current behavior. Run them. Fix any that don't reflect real behavior. Now you have your safety net. Don't touch source code until this is done.</p></div>"},{"id":"p3m1","phase":3,"phaseName":"Prompt Engineering for Code","num":"3.1","title":"Anatomy of a Surgical Prompt","lead":"Vague prompts produce vague code. The structure of your prompt determines the quality of your output before Claude writes a single character.","content":"\n<p>Most developers treat prompts like search queries. They're not. They're engineering specifications. The prompt <em>is</em> the design document for the output you'll receive. Treat it accordingly.</p>\n<h3>The 5-Part Prompt Structure</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">prompt-anatomy.md</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre><span class=\"key\">[1. ROLE / CONTEXT]</span>\nYou are working in an Express + React app with TypeScript strict mode.\nThe auth layer uses httpOnly JWT cookies (see /middleware/auth.ts).\n\n<span class=\"key\">[2. THE EXACT TASK]</span>\nRefactor getUserById in /services/userService.ts.\nExtract the database query into a separate repository function.\nThe service function should not import from the database layer directly.\n\n<span class=\"key\">[3. CONSTRAINTS]</span>\n- Keep the public function signature identical\n- Do not modify /api/users.ts\n- Use /lib/db.ts — do not introduce a new ORM\n\n<span class=\"key\">[4. DEFINITION OF DONE]</span>\n- All existing tests in userService.test.ts still pass\n- A new userRepository.ts file exists\n- userService.ts no longer imports from /lib/db.ts\n\n<span class=\"key\">[5. WHAT NOT TO DO]</span>\n- Do not add error handling beyond what already exists\n- Do not refactor any other functions\n- Do not add TypeScript generics</pre></div>\n<table class=\"compare-table\"><tr><th>Vibe Prompt</th><th></th><th>Surgical Prompt</th></tr>\n<tr><td>\"Clean up the user service\"</td><td>→</td><td>Specific function, specific extraction, exact constraints</td></tr>\n<tr><td>\"Add error handling\"</td><td>→</td><td>Which function, which error types, what the handler does</td></tr>\n<tr><td>\"Refactor to use hooks\"</td><td>→</td><td>Which component, which state, what the hook interface looks like</td></tr>\n<tr><td>\"Make it more maintainable\"</td><td>→</td><td>Not a valid prompt. Define what maintainable means first.</td></tr></table>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 3.1</div><h4>Rewrite 3 Bad Prompts</h4><p>Take 3 prompts you've actually used. Rewrite each using the 5-part structure. Run both versions and compare outputs. Document the delta.</p></div>"},{"id":"p3m2","phase":3,"phaseName":"Prompt Engineering for Code","num":"3.2","title":"Scope Control: The Single Most Important Skill","lead":"Claude Code will helpfully solve problems you didn't ask it to solve. This is a bug, not a feature.","content":"\n<p>Claude Code has a bias toward being comprehensive. Ask it to refactor a function and it will refactor functions near it. Ask it to fix a bug and it will \"improve\" surrounding code. Without explicit scope control, you lose the ability to track what actually changed and why.</p>\n<div class=\"callout danger\"><div class=\"callout-label\">🚨 The Scope Creep Problem</div><p>Every line Claude changes outside your specified scope is a line you didn't review with intent. Multiply this across a large refactor and you have an unmaintainable diff that no one can safely approve.</p></div>\n<h3>Hard Scope Boundaries</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">scope-control phrases</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre><span class=\"comment\"># Explicit file locks</span>\n<span class=\"str\">\"Only modify /services/userService.ts. Do not touch any other file.\"</span>\n\n<span class=\"comment\"># Function-level lock</span>\n<span class=\"str\">\"Only modify the getUserById function.\nLeave all other functions unchanged.\"</span>\n\n<span class=\"comment\"># Interface preservation</span>\n<span class=\"str\">\"The public API must not change.\nAll existing exports must remain with identical signatures.\"</span>\n\n<span class=\"comment\"># Audit prompt</span>\n<span class=\"str\">\"List every file you modified and every line you changed,\nwith the reason. Flag anything you changed that I did not ask for.\"</span></pre></div>\n<div class=\"callout info\"><div class=\"callout-label\">📋 Audit Prompt Template</div><p><em>\"List every file you modified in this session. For each file, list every function or component you changed. For each change, state the reason. Flag anything you changed that I did not explicitly ask you to change.\"</em></p></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 3.2</div><h4>The Scope Test</h4><p>Give Claude Code a task with zero scope constraints. Review the diff. Then repeat the same task with explicit scope boundaries. Compare the diffs. Measure how many extra files were touched in the first run. That number is your scope debt.</p></div>"},{"id":"p3m3","phase":3,"phaseName":"Prompt Engineering for Code","num":"3.3","title":"Prompt Patterns for Node.js","lead":"Six high-value prompt patterns specifically for Express/Node.js refactoring work.","content":"\n<h3>Pattern 1: Route Handler Extraction</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">prompt</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre>Extract the business logic from POST /users in /api/users.ts\ninto a createUser function in /services/userService.ts.\n\nThe route handler should only: validate input, call the service,\nand format the HTTP response. No business logic in the route.\nKeep HTTP status codes identical. Do not change error response shapes.</pre></div>\n<h3>Pattern 2: Middleware Audit</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">prompt</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre>Review /middleware/auth.ts. Do not modify it.\nList every assumption it makes about the request object.\nList every edge case it does not handle.\nList every security concern you identify.\nOutput as a structured list only — no code changes.</pre></div>\n<h3>Pattern 3: Async Error Hardening</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">prompt</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre>Add explicit async error handling to every async function\nin /services/orderService.ts that currently has none.\n\nRules: use try/catch, rethrow with AppError from /lib/errors.ts,\npreserve the original error as the cause.\nDo not change function signatures. Do not add logging.</pre></div>\n<h3>Pattern 4: Dependency Injection Refactor</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">prompt</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre>Refactor /services/emailService.ts to accept its dependencies\n(the mailer and logger) as constructor parameters.\n\nOutput only the modified emailService.ts.\nAlso output changes needed in the ONE place that instantiates it.\nDo not change the calling interface.</pre></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 3.3</div><h4>Apply Two Patterns</h4><p>Pick two patterns above. Apply them to real files in your project. For each, compare the prompt structure vs. a vague equivalent. Document what the constraint language bought you in output quality.</p></div>"},{"id":"p3m4","phase":3,"phaseName":"Prompt Engineering for Code","num":"3.4","title":"Prompt Patterns for React","lead":"React-specific patterns for component decomposition, hook extraction, and state migration.","content":"\n<h3>Pattern 1: Large Component Decomposition</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">prompt</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre>Break UserProfilePage.tsx (currently 650 lines) into smaller components.\n\nRules:\n- Keep all existing props interfaces unchanged\n- Each new component goes in /components/UserProfile/\n- No component should fetch data — lift that to UserProfilePage\n- Use existing design system components from /components/ui/\n- Output a migration plan first, implement one component at a time\n- Stop after each component and wait for approval</pre></div>\n<h3>Pattern 2: Class to Hook Migration</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">prompt</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre>Convert LegacyForm.tsx from a class component to hooks.\n\nNon-negotiable:\n- All existing ref behavior must be preserved exactly\n- componentDidMount logic goes into useEffect — explain your dep array reasoning\n- All error boundary logic must move to a parent ErrorBoundary wrapper\n- The rendered JSX output must be byte-for-byte identical</pre></div>\n<h3>Pattern 3: Data Fetching Centralization</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">prompt</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre>These 4 components all contain duplicate fetch logic for /api/users:\n- UserList.tsx, UserSearch.tsx, AdminPanel.tsx, UserDropdown.tsx\n\nExtract into a single useUsers hook in /hooks/useUsers.ts using React Query.\nThe hook must support: filtering, pagination, and a refresh trigger.\nUpdate each component to use the hook. Do not change rendered output.</pre></div>\n<div class=\"callout warning\"><div class=\"callout-label\">⚠ React-Specific Trap</div><p>When migrating to hooks, always ask Claude Code to explicitly justify every useEffect dependency array. This is the single highest-risk area for AI-generated React code — incorrect deps cause infinite loops and stale closures.</p></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 3.4</div><h4>Extract a Custom Hook</h4><p>Find a React component that contains fetch logic. Use Pattern 3 to extract it into a custom hook. Before running the refactor, write down every behavioral guarantee the component currently provides. After the refactor, verify each one still holds.</p></div>"},{"id":"p4m1","phase":4,"phaseName":"The Refactor Workflow","num":"4.1","title":"Pre-Refactor: The Reconnaissance Protocol","lead":"The work you do before the first prompt determines 80% of the outcome. Skip this and you're guessing.","content":"\n<p>Most developers open a new session and start prompting immediately. This is backwards. Your first session on any refactor should be <strong>read-only reconnaissance</strong> — understanding the codebase, not changing it.</p>\n<h3>The Reconnaissance Protocol</h3>\n<ul class=\"checklist\">\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span><strong>Map dependencies:</strong> Ask Claude Code to list every external dependency and every file that imports from the target.</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span><strong>Identify interfaces:</strong> What are the public contracts? What would break if you changed a signature?</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span><strong>Find hidden coupling:</strong> Ask \"what assumptions does this code make about its environment?\"</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span><strong>Document current behavior:</strong> For each function: what does it do, return, and throw?</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span><strong>Identify risk zones:</strong> Auth, payment, data mutation, external API calls — mark these before you start.</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span><strong>Write characterization tests:</strong> From Module 2.3. Do not skip this.</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span><strong>Write the refactor plan:</strong> Get Claude to output a step-by-step plan. Review it yourself. Then execute.</span></li>\n</ul>\n<div class=\"callout truth\"><div class=\"callout-label\">✓ The Reconnaissance Prompt</div><p><em>\"Do not make any changes. Read [file]. Tell me: every function it exports, every dependency it imports, every function in the codebase that calls into it, and every assumption it makes about its inputs. Output as structured lists only.\"</em></p></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 4.1</div><h4>Full Reconnaissance Run</h4><p>Pick a service or utility file. Run the full reconnaissance protocol on it. The output should be a document you could hand to a new developer and they'd understand the file's role, contracts, and risks without reading a line of code.</p></div>"},{"id":"p4m2","phase":4,"phaseName":"The Refactor Workflow","num":"4.2","title":"Executing the Refactor: Incremental Commits","lead":"The safest refactors are boring. One small change, verified, committed, repeated.","content":"\n<p>The temptation of AI-assisted refactoring is to do everything in one session. It feels fast. It feels productive. And when it breaks, you have a 2,000-line diff with no logical commit points and no idea what broke what.</p>\n<h3>The Incremental Refactor Protocol</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">session workflow</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre><span class=\"comment\">## Each micro-session:</span>\n\n<span class=\"key\">1. STATE THE GOAL</span>\n   Update CLAUDE.md \"Current Session Goal\".\n   State it again in your opening prompt.\n\n<span class=\"key\">2. ONE CHANGE ONLY</span>\n   One logical transformation per session.\n   \"Extract the query\" is one change.\n   \"Extract + add error handling + rename\" is three.\n\n<span class=\"key\">3. VERIFY IMMEDIATELY</span>\n   Run tests. All characterization tests must pass.\n   Run the app. Review the diff with git add -p.\n\n<span class=\"key\">4. COMMIT</span>\n   Write a commit message explaining the WHY.\n   Tag as [ai-assisted].\n\n<span class=\"key\">5. REPEAT or STOP</span>\n   If tests fail — do not proceed. Fix or rollback.\n   If you're losing confidence — stop. New session.</pre></div>\n<div class=\"callout warning\"><div class=\"callout-label\">⚠ The Sunk Cost Trap</div><p>A session that produces working code after 10 corrective prompts is a bad session. The 10 back-and-forth exchanges eroded context integrity. Start fresh. The second attempt will be faster and cleaner.</p></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 4.2</div><h4>Break Down a Real Refactor</h4><p>Take a refactor you've been putting off. Break it into micro-sessions of max 1-2 logical changes each. Map them on paper. Identify dependencies between them. Execute one session today. Commit it. Stop.</p></div>"},{"id":"p4m3","phase":4,"phaseName":"The Refactor Workflow","num":"4.3","title":"Verification: How to Know It's Actually Correct","lead":"\"It looks right\" is not a verification strategy. Here's one that is.","content":"\n<p>This is where most AI-assisted development collapses. The code looks clean. The tests that existed still pass. But new failure modes were introduced that your existing tests didn't cover — and Claude Code had no way to know about them because you didn't tell it.</p>\n<h3>The Verification Stack</h3>\n<table class=\"compare-table\"><tr><th>Layer</th><th>Tool</th><th>What It Catches</th></tr>\n<tr><td>Characterization tests</td><td>Vitest</td><td>Any behavior that changed from the original</td></tr>\n<tr><td>Type checking</td><td>tsc --noEmit</td><td>Interface violations, type drift</td></tr>\n<tr><td>Lint</td><td>ESLint</td><td>Pattern violations, obvious bad practices</td></tr>\n<tr><td>Integration tests</td><td>Supertest</td><td>API contract breakage</td></tr>\n<tr><td>Manual smoke test</td><td>You</td><td>Anything automated didn't cover</td></tr>\n<tr><td>Diff review</td><td>git diff</td><td>Scope creep, unexpected changes</td></tr>\n<tr><td>Peer review</td><td>Teammate</td><td>Logic errors, maintainability regression</td></tr></table>\n<div class=\"callout danger\"><div class=\"callout-label\">🚨 The Confidence Trap</div><p>TypeScript passing and tests green does not mean the refactor is correct. It means it's type-safe and matches documented behavior. Business logic correctness requires human review. Especially for async behavior, race conditions, and authorization checks.</p></div>\n<h3>High-Risk Patterns to Manually Verify</h3>\n<ul>\n<li>Any <strong>auth check</strong> that was moved, extracted, or reordered</li>\n<li>Any <strong>async operation</strong> where Claude changed the await pattern</li>\n<li>Any <strong>useEffect</strong> with a modified dependency array</li>\n<li>Any <strong>error handler</strong> that was restructured</li>\n<li>Any <strong>conditional logic</strong> involving user permissions</li>\n</ul>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 4.3</div><h4>The Adversarial Review</h4><p>After your next AI-assisted refactor, review the diff as if you are trying to find a security vulnerability. Specifically target: error handling paths, authorization checks, and any logic that runs conditionally. Document what you find.</p></div>"},{"id":"p4m4","phase":4,"phaseName":"The Refactor Workflow","num":"4.4","title":"When Claude Code Gets It Wrong","lead":"It will happen. How you respond determines whether you recover fast or spiral.","content":"\n<p>Claude Code produces confident, plausible, wrong code. Not sometimes. Regularly. The question is never \"will it happen\" — it's \"will I catch it, and will I know how to respond?\"</p>\n<h3>Common Failure Patterns</h3>\n<div class=\"callout danger\"><div class=\"callout-label\">Pattern 1: The Confident Wrong Answer</div><p>Syntactically correct, passes stated tests, but has subtly wrong business logic. Usually happens when the task involves domain knowledge you didn't fully specify. Caught by: domain expert review, integration testing, adversarial code review.</p></div>\n<div class=\"callout warning\"><div class=\"callout-label\">Pattern 2: The Helpful Scope Expansion</div><p>Claude \"improves\" code you didn't ask it to touch. Caught by: git diff review, audit prompt. Fix: rollback to checkpoint, add explicit scope constraints, re-run.</p></div>\n<div class=\"callout warning\"><div class=\"callout-label\">Pattern 3: Context Drift</div><p>Mid-session output contradicts earlier output or ignores a constraint you set. Fix: do not try to correct with more prompts. Start a new session. Past assistance in the same session is not reliable after drift.</p></div>\n<div class=\"callout info\"><div class=\"callout-label\">Pattern 4: Hallucinates an API</div><p>Uses a library function that doesn't exist, or uses it with wrong arguments. Always verify library API usage against actual docs — not Claude's memory of them.</p></div>\n<h3>The Recovery Protocol</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">recovery steps</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre><span class=\"key\">1.</span> <span class=\"val\">Stop prompting immediately.</span> More prompts don't fix a broken session.\n<span class=\"key\">2.</span> <span class=\"val\">git diff</span> to understand the full damage.\n<span class=\"key\">3.</span> <span class=\"val\">git checkout .</span> to rollback if you haven't committed checkpoints.\n<span class=\"key\">4.</span> Or <span class=\"val\">git checkout [last-good-commit]</span> if you have checkpoints.\n<span class=\"key\">5.</span> Diagnose: what was missing from your prompt/context?\n<span class=\"key\">6.</span> Update CLAUDE.md with the missing constraint.\n<span class=\"key\">7.</span> New session. Better prompt.</pre></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 4.4</div><h4>Post-Mortem Practice</h4><p>Think of a time Claude Code produced wrong output you used. Write a post-mortem: What did the prompt miss? What constraint would have prevented it? What test would have caught it?</p></div>"},{"id":"p5m1","phase":5,"phaseName":"Production Grade","num":"5.1","title":"Code Review for AI-Assisted Work","lead":"AI-generated code demands a different review posture than human-generated code. Here's why and how.","content":"\n<p>Human developers have taste, context, and continuity. Claude Code has none of that. AI-generated code passes review at a higher rate than it should because reviewers assume the same intentionality behind it. That's a mistake.</p>\n<h3>The Reviewer's Adapted Mindset</h3>\n<p>When reviewing AI-assisted code, assume:</p>\n<ul>\n<li>Every pattern that looks right might be <strong>cargo-culted from training data</strong> rather than chosen for this specific context</li>\n<li>Business logic may be <strong>statistically plausible but domain-incorrect</strong></li>\n<li>Error handling may be <strong>structurally correct but semantically wrong</strong> — catching the wrong things</li>\n<li>Any refactor that \"cleans up\" untouched code <strong>should be treated as untested</strong></li>\n</ul>\n<h3>AI Code Review Checklist</h3>\n<ul class=\"checklist\">\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Diff is scoped to what was requested — no unexpected files changed</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>All public interfaces unchanged (unless the task was to change them)</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Auth/permission checks are present, in the same place, and equivalent</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Error paths are handled — not just happy path</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Async/await patterns are correct — no floating promises</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>No new dependencies added without explicit intent</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Library APIs verified against current documentation</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>All tests pass — and the tests are actually testing the right thing</span></li>\n</ul>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 5.1</div><h4>Review Someone Else's AI-Assisted PR</h4><p>Find a PR in your codebase that was AI-assisted. Review it using the checklist above. Document every item not caught in the original review. Share findings with your team.</p></div>"},{"id":"p5m2","phase":5,"phaseName":"Production Grade","num":"5.2","title":"Building a Team AI Development Standard","lead":"Your personal discipline means nothing if teammates merge unchecked AI code into main.","content":"\n<p>Individual discipline without team standards creates a two-tier codebase: carefully crafted AI work from people who know better, and vibe-prompted garbage from people who don't, mixed together with no way to tell them apart.</p>\n<h3>The Team Standard Document</h3>\n<div class=\"code-block\"><div class=\"code-header\"><div class=\"code-dots\"><div class=\"code-dot\"></div><div class=\"code-dot\"></div><div class=\"code-dot\"></div></div><div class=\"code-label\">AI-DEVELOPMENT-STANDARDS.md</div><button class=\"copy-btn\" onclick=\"copyCode(this)\">copy</button></div>\n<pre><span class=\"key\">## What requires human authorship</span>\n- Auth and permission logic\n- Payment and billing flows\n- Data migration scripts\n- Security middleware\n\n<span class=\"key\">## Required before any AI-assisted PR</span>\n- Characterization tests written and passing\n- CLAUDE.md reviewed and current\n- Branch created: ai/[description]\n\n<span class=\"key\">## Commit message convention</span>\n- All AI-assisted commits tagged: [ai-assisted]\n- Message includes: what changed and why\n\n<span class=\"key\">## PR requirements</span>\n- Diff must be reviewable (no 2000-line PRs)\n- Reviewer must use the AI code review checklist\n- Author must explain every changed line\n\n<span class=\"key\">## Escalation</span>\n- AI output touching a risk zone requires a second reviewer</pre></div>\n<div class=\"callout truth\"><div class=\"callout-label\">✓ The Accountability Test</div><p>Every developer who merges AI-assisted code must be able to stand in front of the team and explain every changed line. If they can't, the PR isn't ready.</p></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 5.2</div><h4>Draft Your Team Standard</h4><p>Write the first draft of an AI development standard for your team. Present it in a retro. Get objections. Iterate. The goal isn't a perfect document — it's shared vocabulary for what \"good AI-assisted development\" looks like on your specific team.</p></div>"},{"id":"p5m3","phase":5,"phaseName":"Production Grade","num":"5.3","title":"Advanced: MCP Servers and Extended Tooling","lead":"When Claude Code connects to your real tools — databases, APIs, CI systems — the stakes get higher, not lower.","content":"\n<p>Claude Code can be extended with MCP (Model Context Protocol) servers to access databases, external APIs, GitHub, and more. This is powerful. It's also the point where disciplined use becomes mandatory. An undisciplined agent with database access is a liability.</p>\n<h3>MCP Safety Principles</h3>\n<div class=\"callout danger\"><div class=\"callout-label\">🚨 Hard Rule: Read Before Write</div><p>Always give Claude Code read-only access to production systems. Write access — to databases, APIs, or filesystems — only in development environments with rollback capability. This is not optional.</p></div>\n<ul>\n<li><strong>Principle of least privilege:</strong> Grant the minimum permissions needed for the task.</li>\n<li><strong>Scope confirmation:</strong> Before any MCP-connected session, explicitly state which systems it's allowed to touch.</li>\n<li><strong>Dry-run first:</strong> For any MCP-enabled task that mutates data, ask Claude to output operations before executing them. Review, then approve.</li>\n<li><strong>Audit trail:</strong> Ensure every MCP operation is logged. You need to know what the agent did, when, and why.</li>\n</ul>\n<div class=\"callout info\"><div class=\"callout-label\">📋 MCP Session Opener Template</div><p><em>\"You have access to [specific MCP tools]. You may read from [X]. You may not write to anything without my explicit approval per operation. Before any write operation, output exactly what you're about to do and wait for my 'proceed' confirmation.\"</em></p></div>\n<div class=\"exercise\"><div class=\"exercise-label\">🔬 Exercise 5.3</div><h4>Map Your Risk Surface</h4><p>List every MCP or external tool integration you're considering. For each, classify: read-only safe, write with approval, or never allow AI access. Document the reasoning for \"never\" cases — this becomes your security policy.</p></div>"},{"id":"p5m4","phase":5,"phaseName":"Production Grade","num":"5.4","title":"Capstone: The Complete Refactor Playbook","lead":"Everything in one place. The repeatable process for any AI-assisted refactor from first commit to production.","content":"\n<p>You've covered every component. Now the synthesis: a complete, repeatable playbook for any refactor from investigation to merged PR.</p>\n<div class=\"callout truth\"><div class=\"callout-label\">✓ The Complete Refactor Playbook</div><p>This is your operating procedure. Deviate from it deliberately, not accidentally.</p></div>\n<h3>Phase A: Before You Start (Non-Negotiable)</h3>\n<ul class=\"checklist\">\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>CLAUDE.md is current and reflects this project's current state</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Created feature branch: <code>ai/[specific-description]</code></span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Reconnaissance session complete — mapped all dependencies and interfaces</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Characterization tests written and passing</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Refactor plan reviewed and approved (by you, minimum)</span></li>\n</ul>\n<h3>Phase B: Execution Loop</h3>\n<ul class=\"checklist\">\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Session goal stated in CLAUDE.md and in opening prompt</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>One logical change per session — hard limit</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Audit prompt run at session end</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>All tests passing before commit</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Staged with <code>git add -p</code> — every hunk reviewed</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Commit message written: what, why, [ai-assisted] tag</span></li>\n</ul>\n<h3>Phase C: Before Merging</h3>\n<ul class=\"checklist\">\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Full test suite passing (<code>npm test</code>)</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>TypeScript clean (<code>tsc --noEmit</code>)</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>High-risk patterns manually verified (auth, async, permissions)</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>PR diff is readable and logically organized</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>You can explain every changed line without referencing \"Claude did it\"</span></li>\n<li><div class=\"check-box\" onclick=\"this.classList.toggle('checked')\"></div><span>Peer review using AI code review checklist (Module 5.1)</span></li>\n</ul>\n<div class=\"callout truth\"><div class=\"callout-label\">✓ You Are Now the Standard</div><p>If you've worked through this course and applied every exercise, you are operating at the level this role demands. The only question left: are you building this discipline into your team, or just yourself?</p></div>"}];

const QB = {"p1m1":[{"q":"What does this module describe Claude Code as, regarding memory?","opts":["A context-aware knowledge base","A highly capable amnesiac contractor","A persistent programming assistant","An intelligent code reviewer"],"correct":1,"explanation":"The module describes Claude Code as a 'highly capable, amnesiac contractor' — brilliant execution, zero long-term memory. Every session you re-onboard from scratch."},{"q":"According to the module, what determines the quality of Claude Code's output?","opts":["The model version you use","The length of your prompt","The quality of what you show it","The complexity of your codebase"],"correct":2,"explanation":"'The quality of that model is entirely determined by you. Bad input, bad output — at the speed of light.' Quality of input determines quality of output."},{"q":"What is YOUR role when using Claude Code, per the module's mental model?","opts":["Passive observer","Code reviewer only","Engineering lead who directs execution","QA tester"],"correct":2,"explanation":"'You are the engineering lead. Claude Code is a senior IC who executes exactly what you specify.' Decision-making stays with you."},{"q":"The module says: 'More detail = better results.' What does reality say?","opts":["More detail always improves results","Shorter prompts are always better","Precise constraints = better results; rambling = noise","Detail level doesn't matter"],"correct":2,"explanation":"The comparison table explicitly states: 'More detail = better results' is what people think, but reality is 'Precise constraints = better results. Rambling = noise.'"},{"q":"When can you NOT review Claude Code's output and verify it's correct?","opts":["When the task is too complex","When the code is well-tested","When you don't understand the task well enough to delegate it","When the context window is full"],"correct":2,"explanation":"The Rule: 'If you wouldn't be able to review Claude Code's output and verify it's correct, you don't understand the task well enough to delegate it yet.'"},{"q":"What does Claude Code understand about your codebase?","opts":["Everything, through deep analysis","Only what's in its context window right now","Only what you've shown it in previous sessions","Nothing — it starts fresh each time"],"correct":1,"explanation":"Reality: 'It understands only what's in its context window right now' — not your whole project, only what you've provided in this session."},{"q":"A developer thinks 'Claude Code won't break things.' What's the reality?","opts":["Claude Code has robust safety checks","It will carefully avoid breaking changes","It will confidently break exactly what you didn't mention","It only makes additive changes"],"correct":2,"explanation":"The table is clear: reality is 'It will confidently break exactly what you didn't mention.' What you don't constrain is fair game."},{"q":"The Exercise 1.1 'Constraint Inventory' asks you to do what BEFORE opening Claude Code?","opts":["Write the code yourself first","Document what the code does, must not do, its interfaces, and how you'd know if it's broken","Run the existing tests","Read the documentation"],"correct":1,"explanation":"Before opening Claude Code: write down (1) what this code does, (2) what it must never do, (3) what other code depends on it, (4) how you'd know if it's broken."}],"p1m2":[{"q":"What is the root cause of most 'Claude drifted halfway through' complaints?","opts":["Model limitations","Poor prompting technique","Context window filling and older context being deprioritized","Network connectivity issues"],"correct":2,"explanation":"'As the window fills, older context gets deprioritized. This is the root cause of most Claude drifted halfway through complaints.'"},{"q":"When Claude Code produces 'generic' output contradicting an earlier instruction, what should you do?","opts":["Add a corrective prompt reminding Claude of the constraint","Start a new session — don't try to fix drift in-session","Scroll up and copy the original instruction again","Continue — it probably remembered it differently"],"correct":1,"explanation":"'Start a new session, not a corrective prompt.' Context drift is not fixable within the same session."},{"q":"What is the recommended commit cadence for AI-assisted sessions?","opts":["Commit at the end of the project","Commit once per day","Commit before ending each session to anchor state","Commit only when tests pass"],"correct":2,"explanation":"'Commit cadence: Commit before ending each session — anchors state.' This ensures you can recover from any session that goes wrong."},{"q":"What happens during a 'late session' with Claude Code?","opts":["Claude becomes more precise","Performance improves as context builds","Real risk of contradicting earlier decisions and ignoring edge cases","No change — Claude maintains full fidelity"],"correct":2,"explanation":"Late session: 'Real risk of contradicting earlier decisions, ignoring edge cases you specified, or reverting to generic patterns.'"},{"q":"How many logical units of work should one session contain?","opts":["As many as possible","Two to three","One","Five or fewer"],"correct":2,"explanation":"'Session size: One logical unit of work per session.' This keeps sessions bounded and allows for clean commits."},{"q":"What should you always do at the start of a new session?","opts":["Open a new browser tab","Re-state your CLAUDE.md goals and current task","Ask Claude to summarize the last session","Run your test suite"],"correct":1,"explanation":"'Session start: Always re-state your CLAUDE.md goals + current task.' This counteracts the lack of persistent memory."},{"q":"What should you NEVER do after noticing context drift?","opts":["Start a new session","Update CLAUDE.md","Continue a session after drift hoping it self-corrects","Commit current progress"],"correct":2,"explanation":"'Never: Continue a session after noticing drift hoping it self-corrects.' Drift compounds — it does not self-correct."},{"q":"What does committing before ending each session provide?","opts":["Cleaner git history","An anchor — a recovery point if the next session fails","Automatic code review","Better performance next session"],"correct":1,"explanation":"'Commit before ending each session — anchors state.' The commit is your recovery point, not just history."}],"p1m3":[{"q":"Which category should 'architectural decisions' fall under?","opts":["Safe to Delegate","Delegate with review","You Must Own","Depends on complexity"],"correct":2,"explanation":"The Delegation Matrix explicitly lists 'Architectural decisions' under 'You Must Own.' These require engineering judgment that Claude Code cannot safely substitute."},{"q":"Which of these is listed as 'Safe to Delegate'?","opts":["Security-sensitive logic","Race conditions and async behavior","Syntax transformation (class to hooks)","Business logic correctness"],"correct":2,"explanation":"'Syntax transformation (class → hooks)' is listed as safe to delegate. It's mechanical and verifiable."},{"q":"What is the 'Can I Review This?' test?","opts":["Can you read the code quickly?","Can you confidently say the output is correct after reviewing it?","Do you have tests for it?","Is the function small enough to understand?"],"correct":1,"explanation":"'If Claude Code produces output for this, can I review it and confidently say it's correct?' If no — learn the domain first or break the task into smaller pieces."},{"q":"What should you do if you can't evaluate Claude Code's output for a task?","opts":["Trust Claude Code's judgment","Delegate it anyway and verify later","Either learn the domain first or break into smaller evaluable pieces","Skip that task entirely"],"correct":2,"explanation":"'You need to either learn the domain first or break the task into smaller pieces you can actually evaluate.'"},{"q":"What are the two mistakes new AI developers make?","opts":["Using wrong models and wrong prompts","Being too verbose and too brief","Delegating nothing OR delegating everything","Not testing and over-testing"],"correct":2,"explanation":"'New AI developers make one of two mistakes: they either delegate nothing (making Claude Code a fancy autocomplete) or they delegate everything.'"},{"q":"Security-sensitive logic falls under which category?","opts":["Safe to Delegate","Delegate with review","You Must Own","Context-dependent"],"correct":2,"explanation":"The Delegation Matrix: Security-sensitive logic is under 'You Must Own.' Getting it wrong is a security issue — automatic own."},{"q":"What is the Hard Rule for security, data loss, or production-incident risks?","opts":["Always use Claude Code with extra review","Never use Claude Code for these","Write it yourself or review it line-by-line with untrusted-PR scrutiny","Get two reviewers instead of one"],"correct":2,"explanation":"'If getting it wrong would be a security issue, a data loss issue, or a production incident — you write it yourself or review it line-by-line with untrusted-PR scrutiny. No exceptions.'"},{"q":"Test scaffolding is categorized as...","opts":["You Must Own","Safe to Delegate","Delegate + Review","Prohibited"],"correct":1,"explanation":"Test scaffolding is listed in the Delegation Matrix under 'Safe to Delegate.' The structure is mechanical; you still verify the assertions are correct."}],"p2m1":[{"q":"What is CLAUDE.md?","opts":["A documentation file for your project","A persistent instruction set — your engineering contract with Claude","A file that stores Claude Code's configuration","A log of all Claude Code sessions"],"correct":1,"explanation":"CLAUDE.md is 'your persistent instruction set — the thing that stops Claude Code from reinventing your architecture every session.'"},{"q":"Where does CLAUDE.md live?","opts":["In the /docs folder","In your home directory","In the project root","In a .claude/ directory"],"correct":2,"explanation":"CLAUDE.md is 'a file in your project root that Claude Code reads at the start of every session.'"},
