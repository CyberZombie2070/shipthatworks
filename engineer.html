{"q":"What is the single most important line in CLAUDE.md?","opts":["The architecture overview","The NEVER section","The Current Session Goal","The folder structure contract"],"correct":2,"explanation":"'The Current Session Goal at the bottom. Update it every time you open a new session. This is what prevents Claude from helpfully solving problems you didn't ask it to solve.'"},{"q":"What happens if you don't update Current Session Goal each session?","opts":["Nothing, it's optional","Claude will ask what the goal is","Claude may solve problems you didn't ask it to solve","The session won't start"],"correct":2,"explanation":"The Current Session Goal 'is what prevents Claude from helpfully solving problems you didn't ask it to solve.' Without it, scope is undefined."},{"q":"CLAUDE.md contains decisions that Claude should...","opts":["Question when they seem wrong","Never question or override","Update automatically over time","Share with all team members"],"correct":1,"explanation":"'Every decision you've already made that Claude should never question or override. The more specific and enforceable, the more value it provides.'"},{"q":"When is Claude Code reading CLAUDE.md?","opts":["On every message","Only when you tell it to","At the start of every session","When it encounters a conflict"],"correct":2,"explanation":"CLAUDE.md is 'a file in your project root that Claude Code reads at the start of every session.'"},{"q":"What should the NEVER section contain?","opts":["Things Claude should do automatically","Files Claude should prioritize","Actions Claude must never take without explicit instruction","Claude Code version requirements"],"correct":2,"explanation":"The NEVER section lists hard prohibitions — things like 'Touch /migrations without explicit instruction' and 'Change the auth middleware.'"},{"q":"Why does the template say '# Last updated: [date]' — what is the purpose?","opts":["For version control metadata","So Claude knows how current the instructions are","As a legal timestamp","For team documentation"],"correct":1,"explanation":"Keeping CLAUDE.md current is essential. If the date is stale, Claude has no way to know if the instructions still apply. Updating it signals the contract is active."}],"p2m2":[{"q":"What branch naming convention does this module recommend for AI sessions?","opts":["feature/[description]","fix/[description]","ai/[description]","claude/[description]"],"correct":2,"explanation":"'git checkout -b ai/refactor-auth-middleware' — the ai/ prefix signals an AI-assisted session and enables selective rollback."},{"q":"What git staging command is non-negotiable for AI-assisted commits?","opts":["git add .","git add -A","git add -p (patch mode)","git add --cached"],"correct":2,"explanation":"'Always use git add -p (patch mode) — never git add . — when committing AI-assisted changes. This forces you to read every diff hunk before it enters your commit history.'"},{"q":"Why use git add -p instead of git add .?","opts":["It's faster","It creates smaller commits","It forces you to read every diff hunk before committing","It automatically tests changes"],"correct":2,"explanation":"'This forces you to read every diff hunk before it enters your commit history. This is not optional.'"},{"q":"What tag should appear in every AI-assisted commit message?","opts":["[claude]","[generated]","[ai-assisted] or [ai]","[auto]"],"correct":2,"explanation":"'Tag AI-assisted commits. Your team deserves to know what to scrutinize more carefully in review. Use [ai] or [ai-assisted].'"},{"q":"What should you do if an AI session produces unusable results?","opts":["Keep prompting until it works","git checkout main && git branch -D ai/[branch]","Reset the HEAD by one commit","Delete the modified files manually"],"correct":1,"explanation":"'If session goes wrong — full rollback: git checkout main && git branch -D ai/refactor-auth-middleware.' The ai/ branch is your containment zone."},{"q":"Before merging a successful AI session, what cleanup should you do?","opts":["Delete all AI commits","git rebase -i main to squash commits","Add a merge commit","Force push to main"],"correct":1,"explanation":"'If session is good — squash before merging: git rebase -i main — clean up the commit history.' Checkpoint commits should become logical commits before merge."},{"q":"What is the primary risk of high-velocity AI development without git discipline?","opts":["Slower development","Inability to safely rollback, review, or explain what changed","Higher cloud costs","Merge conflicts"],"correct":1,"explanation":"'Without a deliberate git strategy, a single session can leave you unable to safely rollback, review, or explain what changed.'"},{"q":"Creating an ai/ branch before each session provides what?","opts":["Better performance","Automatic conflict resolution","Full rollback capability if the session goes wrong","Automatic testing"],"correct":2,"explanation":"The branch is your safety net. If the session goes wrong, you can checkout main and delete the branch — zero damage to your codebase."}],"p2m3":[{"q":"What are characterization tests?","opts":["Tests that verify code is correct","Tests that document current behavior — not verify correctness","Tests written after refactoring","Performance benchmarks"],"correct":1,"explanation":"'Before touching a single line of legacy code, write tests that document current behavior — including behavior that might be bugs. Their job is not to verify correctness. Their job is to tell you when anything changes.'"},{"q":"What is your first move on legacy code before any AI-assisted refactoring?","opts":["Run the existing tests","Open Claude Code and ask it to analyze the code","Write characterization tests","Create a git branch"],"correct":2,"explanation":"'Before touching a single line of legacy code, write [characterization] tests.' These are your safety net before Claude Code touches anything."},{"q":"If a characterization test goes red after an AI refactor, what does that mean?","opts":["The test was wrong — update it","The refactor changed observable behavior — investigate before merging","The test framework has a bug","The refactor was successful"],"correct":1,"explanation":"'Any red test = the refactor changed observable behavior. Investigate before merging.' Red characterization tests are signals, not problems to suppress."},{"q":"The Rule for AI Refactors states: characterization tests must be __ after the refactor.","opts":["Updated to match new behavior","Passing (all green)","Deleted if they conflict","Reviewed manually"],"correct":1,"explanation":"'Characterization tests before the refactor. All green after the refactor. Any red test = the refactor changed observable behavior.'"},{"q":"The example test comments 'We're not saying this behavior is CORRECT.' What is the test documenting?","opts":["Known bugs to fix later","Current behavior — even if it might be a bug","Expected future behavior","The desired behavior"],"correct":1,"explanation":"Characterization tests document current behavior — 'including behavior that might be bugs.' The goal is change detection, not correctness verification."},{"q":"What is the principle about refactoring without tests?","opts":["It's acceptable for small changes","It's fine if Claude Code is careful","It's not refactoring — it's rewriting while pretending you have a safety net","It's acceptable with AI assistance"],"correct":2,"explanation":"'Refactoring without tests is not refactoring. It's rewriting while pretending you have a safety net.'"},{"q":"Why write characterization tests before an AI refactor?","opts":["To satisfy code coverage requirements","To know when any behavior changes during the refactor","To make Claude Code work better","To satisfy team standards"],"correct":1,"explanation":"Their job is to tell you when anything changes. They're your change detection system, not a correctness guarantee."},{"q":"When should you write characterization tests relative to touching source code?","opts":["After the refactor to document what changed","During the refactor","Before touching any source code","Only if you have time"],"correct":2,"explanation":"Exercise 2.3: 'Don't touch the source code until this is done.' Tests first, always."}],"p3m1":[{"q":"What is Part 1 of the 5-Part Prompt Structure?","opts":["The Exact Task","Constraints","Role / Context","Definition of Done"],"correct":2,"explanation":"Part [1] is 'ROLE / CONTEXT' — establishing the environment and codebase context before stating the task."},{"q":"What is Part 5 of the 5-Part Prompt Structure?","opts":["Definition of Done","Constraints","Role / Context","What Not To Do"],"correct":3,"explanation":"Part [5] is 'WHAT NOT TO DO' — explicitly preventing the helpful over-engineering Claude tends toward."},{"q":"What is Part 4 of the 5-Part Prompt Structure?","opts":["Constraints","What Not To Do","Definition of Done","The Exact Task"],"correct":2,"explanation":"Part [4] is 'DEFINITION OF DONE' — the measurable criteria that tell both you and Claude when the task is complete."},{"q":"The module says 'Make it more maintainable' is...","opts":["A valid prompt if used carefully","A good starting point to refine","Not a valid prompt — define what maintainable means first","Acceptable for experienced Claude users"],"correct":2,"explanation":"'Not a valid prompt. Define what maintainable means first.' Vague outcome language is not a specification."},{"q":"How should prompts be treated according to this module?","opts":["Like search queries — short and direct","Like engineering specifications / design documents","Like casual conversation","Like bug reports"],"correct":1,"explanation":"'Most developers treat prompts like search queries. They're not. They're engineering specifications. The prompt is the design document for the output you'll receive.'"},{"q":"What does the structure of your prompt determine?","opts":["How long Claude takes to respond","The quality of output before Claude writes a single character","Whether Claude understands your codebase","How much context Claude uses"],"correct":1,"explanation":"'The structure of your prompt determines the quality of your output before Claude writes a single character.' Structure precedes execution."},{"q":"Part 3 (Constraints) in the example includes 'Do not modify /api/users.ts.' This represents what type of constraint?","opts":["Output format constraint","File scope lock — prevent scope creep","Performance constraint","Naming convention constraint"],"correct":1,"explanation":"File scope locks ('Do not modify X') are Constraint-layer scope controls that prevent Claude from touching code outside your intended change."},{"q":"Why include Part 5 'What Not To Do' in every prompt?","opts":["To make the prompt longer","To prevent Claude from making 'helpful' changes you didn't want","To demonstrate engineering rigor","To improve Claude's memory"],"correct":1,"explanation":"Part [5] explicitly prevents the helpful over-engineering Claude tends toward — adding error handling you didn't ask for, adding TypeScript generics, refactoring adjacent functions."}],"p3m2":[{"q":"What causes scope creep in AI-generated code?","opts":["Bugs in Claude Code","Claude's bias toward being comprehensive without explicit boundaries","Large context windows","Complex codebases"],"correct":1,"explanation":"'Claude Code has a bias toward being comprehensive. Ask it to refactor a function and it will refactor functions near it.' Without explicit constraints, Claude fills the vacuum."},{"q":"What does the audit prompt ask Claude to list?","opts":["Potential bugs in the code","Every file modified, every function changed, every reason, and unauthorized changes","Test coverage statistics","Dependencies used"],"correct":1,"explanation":"'List every file you modified. For each file, list every function or component you changed. For each change, state the reason. Flag anything you changed that I did not explicitly ask you to change.'"},{"q":"What phrase helps preserve a module's public API?","opts":["'Review the public interface'","'All existing exports must remain with identical signatures'","'Keep the API unchanged if possible'","'Maintain backward compatibility'"],"correct":1,"explanation":"'The public API of this module must not change. All existing exports must remain with identical signatures.' This is the exact phrase to use."},{"q":"Why is scope creep in AI diffs dangerous?","opts":["It's not dangerous — extra improvements are welcome","It creates diffs no one can safely approve","It slows down development","It causes merge conflicts"],"correct":1,"explanation":"'Every line Claude changes outside your specified scope is a line you didn't review with intent. Multiply this across a large refactor and you have an unmaintainable diff that no one can safely approve.'"},{"q":"What is your 'scope debt' as defined by Exercise 3.2?","opts":["Technical debt from AI-generated code","Number of extra files touched outside specified scope","Time spent reviewing AI code","Unused code introduced by Claude"],"correct":1,"explanation":"Exercise 3.2: 'Measure how many extra files were touched in the first run. This number is your scope debt.' It quantifies the cost of vague prompting."},{"q":"The phrase 'Only modify /services/userService.ts. Do not touch any other file.' is an example of...","opts":["A definition of done","An explicit file scope lock","A role/context statement","A constraint about naming"],"correct":1,"explanation":"This is a file scope lock — the most explicit form of scope control, preventing any changes to files not specifically named."},{"q":"What should you always include in a code modification prompt?","opts":["Your name and date","Explicit scope boundaries and file locks","Detailed business context","The full file content"],"correct":1,"explanation":"Scope control phrases to always include: explicit file locks, function-level locks, interface preservation statements, and audit prompts."},{"q":"When should you run the audit prompt?","opts":["Before starting a session","After every Claude response","At the end of any Claude Code session, before reviewing the diff","Only when something seems wrong"],"correct":2,"explanation":"'After any Claude Code session, run this as your final prompt before reviewing the diff.' The audit prompt is your session closeout step."}],"p3m3":[{"q":"Pattern 1 is called...","opts":["Middleware Audit","Route Handler Extraction","Dependency Injection Refactor","Async Error Hardening"],"correct":1,"explanation":"Pattern 1: Route Handler Extraction — extracting business logic from route handlers into service functions."},{"q":"Pattern 2 (Middleware Audit) tells Claude to do what?","opts":["Refactor the middleware","List issues and security concerns WITHOUT modifying the file","Add error handling to the middleware","Replace the middleware with a better version"],"correct":1,"explanation":"'Review /middleware/auth.ts. Do not modify it. List every assumption... Output as a structured list only — no code changes.' Pattern 2 is analysis-only."},{"q":"Pattern 3 is for...","opts":["Route extraction","Component decomposition","Async Error Hardening","Data fetching centralization"],"correct":2,"explanation":"Pattern 3: Async Error Hardening — adding try/catch with AppError rethrow to async functions that currently lack error handling."},{"q":"Which pattern uses constructor parameters to accept dependencies?","opts":["Pattern 1: Route Handler Extraction","Pattern 2: Middleware Audit","Pattern 3: Async Error Hardening","Pattern 4: Dependency Injection Refactor"],"correct":3,"explanation":"Pattern 4: Dependency Injection Refactor — 'accept its dependencies (the mailer and logger) as constructor parameters instead of importing them directly.'"},{"q":"In Pattern 1, after extraction what should remain in the route handler?","opts":["All business logic plus HTTP formatting","Nothing — route handlers should be empty","Only: validate input, call the service, and format the HTTP response","Only error handling"],"correct":2,"explanation":"'The route handler should only: validate input, call the service, and format the HTTP response. No business logic should remain in the route.'"},{"q":"In Pattern 3, what class should errors be rethrown as?","opts":["Error","HttpError","AppError (from /lib/errors.ts)","ServiceError"],"correct":2,"explanation":"'use try/catch, rethrow with our AppError class from /lib/errors.ts, preserve the original error as the cause.'"},{"q":"Pattern 2 outputs...","opts":["Refactored middleware code","A pull request with fixes","Structured lists only — no code changes","Test cases for the middleware"],"correct":2,"explanation":"'Output as a structured list only — no code changes.' Pattern 2 is a read-only audit pattern."},{"q":"In Pattern 4, how should the service receive its dependencies?","opts":["As environment variables","Via a dependency injection framework","As constructor parameters (not imported directly)","Through global module state"],"correct":2,"explanation":"'accept its dependencies (the mailer and logger) as constructor parameters instead of importing them directly.'"}],"p3m4":[{"q":"In Pattern 1 (Large Component Decomposition), where should new components be placed?","opts":["Anywhere in /components/","In /components/[ParentName]/ — a dedicated subdirectory","In the same file as the parent","In /components/shared/"],"correct":1,"explanation":"'Each new component must be in its own file in /components/UserProfile/' — a dedicated subdirectory named after the parent component."},{"q":"The React-Specific Trap warns about which high-risk area?","opts":["useState initialization","useEffect dependency arrays","React.memo usage","Component prop types"],"correct":1,"explanation":"'Always ask Claude Code to explicitly justify every useEffect dependency array. This is the single highest-risk area for AI-generated React code — incorrect deps cause infinite loops and stale closures.'"},{"q":"In Pattern 2 (Class to Hook Migration), what must happen to error boundary logic?","opts":["Delete it — hooks handle errors better","Convert it to useState error handling","Move to a parent ErrorBoundary wrapper (provided by Claude)","Keep it as-is in the converted component"],"correct":2,"explanation":"'All error boundary logic must move to a parent ErrorBoundary wrapper (provide it).' Class-based error boundaries can't be converted to hooks — they must become wrappers."},{"q":"Pattern 3 is about...","opts":["Breaking large components apart","Converting class components to hooks","Data Fetching Centralization using React Query","Optimizing re-renders with useMemo"],"correct":2,"explanation":"Pattern 3: Data Fetching Centralization — extracting duplicate fetch logic across 4 components into a single useUsers hook using React Query."},{"q":"In Pattern 1, what must NOT change?","opts":["Component file names","All existing props interfaces","The component's internal state","How the component is styled"],"correct":1,"explanation":"'Keep all existing props interfaces — do not change what parents pass in.' The component's external contract must be preserved."},{"q":"Why ask Claude to justify every useEffect dependency array?","opts":["For code documentation","Claude often forgets to add them","Incorrect deps cause infinite loops and stale closures that are hard to debug","It's a TypeScript requirement"],"correct":2,"explanation":"'Incorrect deps cause infinite loops and stale closures that are hard to debug.' This is the highest-risk AI React output — always demand justification."},{"q":"The useUsers hook from Pattern 3 must support what three features?","opts":["Sorting, filtering, and pagination","Filtering, pagination, and a refresh trigger","Caching, filtering, and real-time updates","Pagination, sorting, and search"],"correct":1,"explanation":"'The hook must support: filtering, pagination, and a refresh trigger.' These are the three requirements specified in Pattern 3."},{"q":"In Pattern 1's decomposition, which component DOES the data fetching?","opts":["Each decomposed sub-component independently","The new shared /components/ui/ components","Only UserProfilePage — decomposed components receive data via props","A separate data layer component"],"correct":2,"explanation":"'No component should fetch data — lift that to UserProfilePage.' The parent page component owns data fetching; decomposed components are presentational."}],"p4m1":[{"q":"What should your first session on any refactor be?","opts":["Writing the first code changes","Read-only reconnaissance — understanding, not changing","Setting up the branch and CLAUDE.md","Running characterization tests"],"correct":1,"explanation":"'Your first session on any refactor should be read-only reconnaissance — understanding the codebase, not changing it.'"},{"q":"How many steps does the Reconnaissance Protocol checklist have?","opts":["4","5","6","7"],"correct":3,"explanation":"The Reconnaissance Protocol checklist has 7 steps: map dependencies, identify interfaces, find hidden coupling, document current behavior, identify risk zones, write characterization tests, write the refactor plan."},{"q":"What does the Reconnaissance Prompt tell Claude NOT to do?","opts":["Read the file","List dependencies","Make any changes","Search the codebase"],"correct":2,"explanation":"'Do not make any changes.' The Reconnaissance Prompt is explicitly read-only: understand and document, never modify."},{"q":"Step 6 in the Reconnaissance Protocol is...","opts":["Identify risk zones","Write the refactor plan","Write characterization tests","Find hidden coupling"],"correct":2,"explanation":"Step 6: 'Write characterization tests: From Module 2.3. Do not skip this.' Characterization tests are part of reconnaissance, before any code changes."},{"q":"'Find hidden coupling' in the Reconnaissance Protocol helps identify...","opts":["Performance bottlenecks","Implicit dependencies and assumptions the code makes about its environment","Code style violations","Unused imports"],"correct":1,"explanation":"'Ask what assumptions does this code make about its environment? Often reveals implicit dependencies.' Hidden coupling causes unexpected breakage during refactors."},{"q":"What is Step 7 of the Reconnaissance Protocol?","opts":["Write characterization tests","Identify risk zones","Write the refactor plan before any code changes","Map dependencies"],"correct":2,"explanation":"Step 7: 'Write the refactor plan: Before any code changes, get Claude Code to output a step-by-step plan. Review it yourself. Then execute it.'"},{"q":"The Reconnaissance Prompt instructs Claude to output results as...","opts":["A code diff","Structured lists only","A narrative description","A modified version of the file"],"correct":1,"explanation":"'Output as structured lists only.' The reconnaissance phase produces documentation, not code changes."},{"q":"Mapping dependencies should reveal...","opts":["Every bug in the file","Every external dependency and every file that imports from the target","Performance characteristics","Code quality metrics"],"correct":1,"explanation":"'Ask Claude Code to read the target file and list every external dependency and every file that imports from it.' This maps the blast radius of any change."}],"p4m2":[{"q":"How many logical changes per micro-session?","opts":["As many as possible","Three maximum","Two","One — hard limit"],"correct":3,"explanation":"'ONE CHANGE ONLY: One logical transformation per session.' This is a hard limit. 'Extract the query and add error handling and rename things is three.'"},{"q":"What is Step 3 in the micro-session loop?","opts":["State the Goal","Commit","Verify Immediately (run tests, review diff)","Repeat or Stop"],"correct":2,"explanation":"Step 3: 'VERIFY IMMEDIATELY: Run tests. All characterization tests must pass. Run the app. Review the diff with git add -p.'"},{"q":"What is the 'Sunk Cost Trap' described in this module?","opts":["Continuing to use AI tools after a bad experience","Continuing a session with 10 corrective prompts instead of starting fresh","Keeping bad code because it took time to write","Over-investing in test infrastructure"],"correct":1,"explanation":"'A session that produces working code after 10 corrective prompts is a bad session. The 10 back-and-forth exchanges eroded context integrity. Start fresh.'"},{"q":"Every AI-assisted commit message should include what tag?","opts":["[claude]","[ai-assisted]","[generated]","[review-required]"],"correct":1,"explanation":"Step 4: 'Write a commit message that explains the WHY, not the what. Tag as [ai-assisted].'"},{"q":"What should a commit message explain according to Step 4?","opts":["What changed (the code diff)","The WHY — motivation, not mechanics","Which files were modified","The Claude Code session ID"],"correct":1,"explanation":"'Write a commit message that explains the WHY, not the what.' The diff shows what changed; the message explains why it was the right change."},{"q":"When should you stop a micro-session and start a new one?","opts":["After 30 minutes","When you've made 5 changes","If tests fail or you're losing confidence in what changed","When context window fills"],"correct":2,"explanation":"'If tests fail — do not proceed. Fix or rollback. If you're losing confidence in what changed — stop. New session.'"},{"q":"How should you stage changes for AI commits?","opts":["git add .","git add -A","git add -p (interactive staging — review every hunk)","git add --all"],"correct":2,"explanation":"Step 4 and Module 2.2: Use 'git add -p' — interactive staging that forces you to review every hunk before committing."},{"q":"Why is 'Extract the query AND add error handling AND rename things' described as wrong for one session?","opts":["It's too complex for Claude Code","It's three separate changes — context integrity requires one change per session","It would take too long","It mixes different types of refactors"],"correct":1,"explanation":"Each of these is a distinct logical transformation with its own commit point. Bundling them erodes context integrity and makes verification harder."}],"p4m3":[{"q":"Which verification layer catches 'interface violations, type drift'?","opts":["Vitest characterization tests","ESLint","tsc --noEmit","Supertest integration tests"],"correct":2,"explanation":"The Verification Stack: Type checking with 'tsc --noEmit' catches 'Interface violations, type drift.'"},{"q":"What does 'TypeScript passing + tests green' NOT guarantee?","opts":["That the code compiles","That the code is correct — only that it's type-safe and matches documented behavior","That tests exist","That linting passes"],"correct":1,"explanation":"The Confidence Trap: 'TypeScript passing and tests green does not mean the refactor is correct. It means it's type-safe and matches documented behavior. Business logic correctness requires human review.'"},{"q":"Which verification layer catches 'API contract breakage'?","opts":["tsc --noEmit","git diff review","Supertest (integration tests)","Manual smoke test"],"correct":2,"explanation":"The Verification Stack: 'Integration tests (Supertest)' catches 'API contract breakage.'"},{"q":"How many layers are in the Verification Stack?","opts":["4","5","6","7"],"correct":3,"explanation":"The Verification Stack has 7 layers: characterization tests, type checking, lint, integration tests, manual smoke test, diff review, peer review."},{"q":"What does peer review catch that automated tools miss?","opts":["Syntax errors","Type violations","Logic errors and maintainability regression","Performance issues"],"correct":2,"explanation":"Verification Stack: 'Peer review (Teammate)' catches 'Logic errors, maintainability regression.' Humans catch what machines miss."},{"q":"What tool is 'You' in the Verification Stack, and what does it catch?","opts":["tsc — type errors","Peer review — logic errors","Manual smoke test — anything automated didn't cover","Lint prompt with the constraint","Copy the constraint from the beginning of the session","Do not try to correct; start a new session with better context","Scroll up and re-run the session from that point"],"correct":2,"explanation":"'Fix: do not try to correct drift in-session. Start a new session with better context.' In-session corrections don't work because the context is already compromised."},{"q":"Pattern 4 (Hallucinated API) is caught by...","opts":["git diff","TypeScript, tests, or reading the output carefully","Peer review","The audit prompt"],"correct":1,"explanation":"'Caught by: TypeScript, tests, or reading the output carefully. Always verify library API usage against the actual docs — not Claude's memory of them.'"},{"q":"What is Recovery Step 1?","opts":["git diff to understand the damage","Update CLAUDE.md","Stop prompting immediately","Start a new session"],"correct":2,"explanation":"Step 1: 'Stop prompting immediately. More prompts don't fix a broken session.' This is counterintuitive but critical."},{"q":"What is Recovery Step 6?","opts":["git checkout to the last good commit","Start a new session","Update CLAUDE.md with the missing constraint","Write characterization tests"],"correct":2,"explanation":"Step 6: 'Update CLAUDE.md with the missing constraint.' The failure teaches you something; encode that learning so it doesn't happen again."},{"q":"Where should missing constraints discovered from a failure be recorded?","opts":["In a separate failures.md file","In the git commit message","In CLAUDE.md","In a team Slack channel"],"correct":2,"explanation":"'Update CLAUDE.md with the missing constraint.' CLAUDE.md is the persistent contract — failures reveal gaps in it that need to be filled."}],"p5m1":[{"q":"Why does AI-generated code pass review at higher rates than it should?","opts":["It's genuinely higher quality","Reviewers assume the same intentionality as human-written code","Reviewers don't have time for thorough review","AI code is harder to read"],"correct":1,"explanation":"'AI-generated code passes review at a higher rate than it should because reviewers assume the same intentionality behind it. That's a mistake.'"},{"q":"How many items are in the AI Code Review Checklist?","opts":["5","6","7","8"],"correct":3,"explanation":"The AI Code Review Checklist has 8 items covering: diff scope, interfaces, auth, error paths, async patterns, dependencies, library APIs, and tests."},{"q":"What should reviewers assume about patterns that 'look right' in AI code?","opts":["They are correct — AI learns from quality code","They might be cargo-culted from training data rather than chosen for this context","They are better than human-written patterns","They should be reviewed quickly"],"correct":1,"explanation":"'Every pattern that looks right might be cargo-culted from training data rather than chosen for this specific context.'"},{"q":"What is described as 'statistically plausible but domain-incorrect'?","opts":["Type annotations","Error handling","Business logic","Code formatting"],"correct":2,"explanation":"'Business logic may be statistically plausible but domain-incorrect.' Claude predicts what looks right; it doesn't know your business rules."},{"q":"The module says error handling in AI code may be...","opts":["More robust than human-written error handling","Structurally correct but semantically wrong — catching the wrong things","Always incorrect and needs rewriting","Correct if the tests pass"],"correct":1,"explanation":"'Error handling may be structurally correct but semantically wrong — catching the wrong things.' Structure != semantics."},{"q":"What must the code author be able to do with every changed line?","opts":["Explain it without referencing 'Claude did it'","Show which prompt produced it","Provide test coverage for it","Attribute it to a specific PR"],"correct":0,"explanation":"Checklist item: 'You can explain every changed line without referencing Claude did it.' If you can't explain it, you don't own it yet."},{"q":"The checklist item about async patterns checks for...","opts":["Async/await usage","No floating promises","Promise.all usage","Async error handling"],"correct":1,"explanation":"'Async/await patterns are correct — no floating promises.' Floating promises (unhandled promise rejections) are a common AI error."},{"q":"What type of code is described as 'should be treated as untested'?","opts":["Code without type annotations","Code written in unfamiliar frameworks","Any refactor that 'cleans up' untouched code","Code older than 6 months"],"correct":2,"explanation":"'Any refactor that cleans up untouched code should be treated as untested.' If Claude touched it without explicit instruction, there are no characterization tests for it."}],"p5m2":[{"q":"The Team Standard Document should fit on...","opts":["As many pages as needed","Three pages maximum","One page","A wiki page with unlimited sections"],"correct":2,"explanation":"'A one-page document your team agrees to.' Brevity ensures it gets read and followed."},{"q":"What items require human authorship according to the team standard?","opts":["All code","Only frontend code","Auth, payment/billing flows, data migration scripts, security middleware","Only code touching the database"],"correct":2,"explanation":"'What requires human authorship: Auth and permission logic, Payment and billing flows, Data migration scripts, Security middleware.'"},{"q":"What branch convention does the team standard require?","opts":["feature/[description]","fix/[description]","ai/[description]","hotfix/[description]"],"correct":2,"explanation":"'Branch created: ai/[description]' — required before any AI-assisted PR."},{"q":"The Accountability Test states that developers must be able to...","opts":["Prove AI didn't write the critical parts","Explain every changed line when asked","Provide a testing summary","Show the prompts they used"],"correct":1,"explanation":"'Every developer who merges AI-assisted code must be able to stand only; write only in dev with rollback capability","Two-person rule for any database access","Dry-run everything first"],"correct":1,"explanation":"'Always give Claude Code read-only access to production systems. Write access — to databases, APIs, or filesystems — only in development environments with rollback capability.'"},{"q":"The Principle of Least Privilege means...","opts":["Give Claude the minimum permissions needed for the task","Give Claude read-only access always","Never give Claude database access","Audit all Claude Code MCP usage"],"correct":0,"explanation":"'Principle of least privilege: Grant the minimum permissions needed for the task. A session analyzing your database schema doesn't need write access.'"},{"q":"Before any MCP write operation, what should Claude do?","opts":["Execute immediately for speed","Log the operation and proceed","Output the operations it will perform and wait for approval","Ask for a confirmation code"],"correct":2,"explanation":"'For any MCP-enabled task that mutates data, ask Claude Code to output the operations it will perform before executing them. Review, then approve.'"},{"q":"What is 'Dry-run first'?","opts":["Testing in a sandbox environment","Asking Claude to output planned operations before executing them","Running Claude Code without MCP connections","Testing with synthetic data"],"correct":1,"explanation":"'Dry-run first: For any MCP-enabled task that mutates data, ask Claude Code to output the operations it will perform before executing them.'"},{"q":"What MCP safety principle ensures you know what the agent did, when, and why?","opts":["Principle of least privilege","Scope confirmation","Audit trail of every MCP operation","Dry-run first"],"correct":2,"explanation":"'Audit trail: Ensure every MCP operation is logged. You need to know what the agent did, when, and why.'"},{"q":"The MCP Session Opener Template instructs Claude to...","opts":["Connect to all available systems","Use read-only mode by default","Output ion":"Phase B checklist: 'All tests passing before commit.' No commit should introduce failing tests."},{"q":"In Phase C, what TypeScript command must be clean before merging?","opts":["tsc --strict","tsc --build","tsc --noEmit","tsc --check"],"correct":2,"explanation":"Phase C checklist: 'TypeScript clean (tsc --noEmit).' This verifies type correctness without producing output files."},{"q":"The final callout says about AI-generated code: who is responsible for it?","opts":["Claude Code, as the author","The tool vendor","The developer who merges it","The tech lead who approved it"],"correct":2,"explanation":"'The AI wrote the code. The developer is responsible for it.' (From Module 5.2 Accountability Test, echoed here.) Authorship and responsibility are separate."},{"q":"Phase A requires creating a branch named...","opts":["feature/[description]","refactor/[description]","ai/[specific-description]","claude/[description]"],"correct":2,"explanation":"Phase A checklist: 'Created feature branch: ai/[specific-description].' The ai/ prefix signals AI-assisted work."}]};

// ── STATE ──
var sq = String.fromCharCode(39); // apostrophe for onclick attrs
let completed = new Set(JSON.parse(localStorage.getItem('eng_completed') || '[]'));
let passedQuizzes = new Set(JSON.parse(localStorage.getItem('eng_quizzes') || '[]'));
let bookmarks = new Set(JSON.parse(localStorage.getItem('eng_bookmarks') || '[]'));
let currentMod = null;
let quizState = {};
let notesTimer = null;

// ── SEARCH INDEX ──
const SEARCH_IDX = MODULES.map(function(m) {
  return {
    id: m.id, num: m.num, title: m.title,
    text: (m.lead + ' ' + m.content).replace(/<[^>]+>/g,' ').toLowerCase()
  };
});

// ── PROGRESS ──
function updateProgress() {
  const n = completed.size;
  const total = MODULES.length;
  const pct = Math.round(n / total * 100);
  const el = function(id) { return document.getElementById(id); };
  if (el('sbFill')) el('sbFill').style.width = pct + '%';
  if (el('tbFill')) el('tbFill').style.width = pct + '%';
  if (el('sbCount')) el('sbCount').textContent = n + ' / ' + total + ' modules';
  if (el('tbPct')) el('tbPct').textContent = n + ' / ' + total;
  const doneIds = [...completed];
  let minsDone = 0;
  doneIds.forEach(function(id) { const t = TIME_MAP[id]; if (t) minsDone += parseInt(t); });
  let minsTotal = 0;
  Object.values(TIME_MAP).forEach(function(t) { minsTotal += parseInt(t); });
  const minsLeft = minsTotal - minsDone;
  const h = Math.floor(minsLeft / 60);
  const m = minsLeft % 60;
  if (el('sbTime')) el('sbTime').textContent = h > 0 ? '~' + h + 'h ' + (m > 0 ? m + 'm' : '') + ' left' : m + 'm left';
  const cb = el('certBtn');
  if (cb) cb.style.display = n === total ? 'block' : 'none';
  localStorage.setItem('eng_completed', JSON.stringify([...completed]));
}

// ── BUILD SIDEBAR ──
function buildSidebar(container) {
  container = container || document.getElementById('sbNav');
  if (!container) return;
  let html = '';
  const bms = MODULES.filter(function(m) { return bookmarks.has(m.id); });
  if (bms.length) {
    html += '<div class="sb-sect">&#9733; Bookmarks</div>';
    bms.forEach(function(m) { html += buildNavItem(m); });
  }
  let curPhase = 0;
  MODULES.forEach(function(m) {
    if (m.phase !== curPhase) {
      curPhase = m.phase;
      const pm = PHASE_META.find(function(p) { return p.n === curPhase; });
      html += '<div class="phase-hdr"><span class="ph-num">P' + curPhase + '</span>' + (pm ? pm.name : '') + '</div>';
    }
    html += buildNavItem(m);
  });
  container.innerHTML = html;
}

function buildNavItem(m) {
  const active = currentMod === m.id ? ' active' : '';
  const bmOn = bookmarks.has(m.id) ? ' on' : '';
  const done = completed.has(m.id);
  return '<div class="nav-item' + active + '" id="ni-' + m.id + '">' +
    '<span class="ni-title" onclick="showModule(' + sq + m.id + sq + ')">' + m.num + ' ' + m.title + '</span>' +
    (done ? '<span class="ni-done">&#10003;</span>' : '') +
    '<span class="ni-time">' + (TIME_MAP[m.id] || '') + '</span>' +
    '<button class="ni-bm' + bmOn + '" onclick="toggleBookmark(' + sq + m.id + sq + ')" title="Bookmark">&#9733;</button>' +
    '</div>';
}

// ── COURSE HOME ──
function buildHome() {
  const last = localStorage.getItem('eng_last');
  const resumeMod = last ? MODULES.find(function(m) { return m.id === last; }) : null;
  const nextMod = MODULES.find(function(m) { return !completed.has(m.id); });
  let html = '<div class="course-home">';
  html += '<div class="ch-eyebrow">// ai_code_engineer.course</div>';
  html += '<h1 class="ch-title">Stop Vibing.<br>Start <em>Engineering</em>.</h1>';
  html += '<p class="ch-sub">A complete curriculum for Node.js and React developers who want to use Claude Code with the discipline of a senior engineer — not the optimism of a first-timer.</p>';
  html += '<div class="ch-stats">';
  html += '<div><div class="chs-val">5<span>×</span></div><div class="chs-lbl">Phases</div></div>';
  html += '<div><div class="chs-val">18</div><div class="chs-lbl">Modules</div></div>';
  html += '<div><div class="chs-val">~<span>12</span>h</div><div class="chs-lbl">Duration</div></div>';
  html += '<div><div class="chs-val">' + completed.size + '</div><div class="chs-lbl">Completed</div></div>';
  html += '</div>';
  html += '<div class="ch-actions">';
  if (resumeMod) {
    html += '<button class="btn btn-primary" onclick="showModule(' + sq + resumeMod.id + sq + ')">Resume: ' + resumeMod.num + ' ' + resumeMod.title + '</button>';
  } else if (nextMod) {
    html += '<button class="btn btn-primary" onclick="showModule(' + sq + nextMod.id + sq + ')">Start Course →</button>';
  }
  html += '</div>';
  html += '<div class="phase-cards">';
  PHASE_META.forEach(function(pm) {
    const modsDone = pm.mods.filter(function(id) { return completed.has(id); }).length;
    html += '<div class="pc" onclick="showModule(' + sq + pm.mods[0] + sq + ')">';
    html += '<div class="pc-badge" style="background:' + pm.color + ';color:#0f1117">P' + pm.n + '</div>';
    html += '<div class="pc-body"><div class="pc-title">' + pm.name + '</div><div class="pc-desc">' + pm.desc + '</div>';
    html += '<div class="pc-mods">' + pm.mods.length + ' modules</div></div>';
    html += '<div class="pc-done">' + modsDone + '/' + pm.mods.length + '</div>';
    html += '</div>';
  });
  html += '</div></div>';
  document.getElementById('homeView').innerHTML = html;
}

// ── MODULE VIEW ──
function showModule(id) {
  const mod = MODULES.find(function(m) { return m.id === id; });
  if (!mod) return;
  currentMod = id;
  localStorage.setItem('eng_last', id);
  document.getElementById('homeView').style.display = 'none';
  const mv = document.getElementById('modView');
  mv.style.display = 'block';
  const pm = PHASE_META.find(function(p) { return p.n === mod.phase; });
  const phaseColor = pm ? pm.color : 'var(--accent)';
  const modIdx = MODULES.findIndex(function(m) { return m.id === id; });
  const prevMod = modIdx > 0 ? MODULES[modIdx - 1] : null;
  const nextMod = modIdx < MODULES.length - 1 ? MODULES[modIdx + 1] : null;
  const isDone = completed.has(id);
  const savedNotes = localStorage.getItem('eng_notes_' + id) || '';
  mv.innerHTML =
    '<div class="mod-bc">' +
      '<a onclick="goHome()">All Courses</a>' +
      '<span class="bc-sep">/</span>' +
      '<a onclick="goHome()">AI Code Engineer</a>' +
      '<span class="bc-sep">/</span>' +
      '<span class="bc-cur">' + mod.num + ' ' + mod.title + '</span>' +
    '</div>' +
    '<div class="audio-shell"><div class="audio-inner">' +
      '<div class="audio-play">▶</div>' +
      '<div class="audio-bar"></div>' +
      '<span class="audio-time">0:00 / ' + (TIME_MAP[id] || '0:00') + '</span>' +
      '<span class="audio-lbl">Audio coming soon</span>' +
    '</div></div>' +
    '<div class="mod-tabs">' +
      '<button class="tab-btn active" id="tbl-lesson-' + id + '" onclick="tabLesson(' + sq + id + sq + ')">Lesson</button>' +
      '<button class="tab-btn" id="tbl-transcript-' + id + '" onclick="tabTranscript(' + sq + id + sq + ')">Transcript</button>' +
      '<button class="tab-btn" id="tbl-notes-' + id + '" onclick="tabNotes(' + sq + id + sq + ')">Notes</button>' +
    '</div>' +
    '<div class="tab-pane" id="tp-lesson-' + id + '">' +
      '<div class="mod-eyebrow"><span class="ptag" style="background:' + phaseColor + ';color:#0f1117">Phase ' + mod.phase + '</span><span class="mnum">' + mod.num + '</span></div>' +
      '<h2>' + mod.title + '</h2>' +
      '<p class="mod-lead">' + mod.lead + '</p>' +
      mod.content +
      buildQuizSection(id) +
    '</div>' +
    '<div class="tab-pane hidden" id="tp-transcript-' + id + '">' +
      '<div class="transcript-ph">Transcript will be available when audio is published.</div>' +
    '</div>' +
    '<div class="tab-pane hidden" id="tp-notes-' + id + '">' +
      '<textarea class="notes-ta" id="notes-' + id + '" placeholder="Your notes for this module…" oninput="saveNotes(' + sq + id + sq + ')">' + savedNotes + '</textarea>' +
      '<div class="notes-meta"><span>Auto-saved</span><span id="nc-' + id + '">' + savedNotes.length + ' chars</span></div>' +
    '</div>' +
    '<div class="mod-footer">' +
      (prevMod ? '<button class="btn btn-secondary" onclick="showModule(' + sq + prevMod.id + sq + ')">← ' + prevMod.num + '</button>' : '') +
      (nextMod ? '<button class="btn btn-primary" onclick="showModule(' + sq + nextMod.id + sq + ')">Next: ' + nextMod.num + ' →</button>' : '') +
      '<button class="btn btn-complete' + (isDone ? ' done' : '') + '" id="cbtn-' + id + '" onclick="toggleComplete(' + sq + id + sq + ')">' +
        (isDone ? '✓ Complete' : 'Mark Complete') +
      '</button>' +
    '</div>';
  buildSidebar();
  scrollTop();
  if (QB[id] && !quizState[id]) {
    setTimeout(function() { startQuiz(id); }, 100);
  }
}

function goHome() {
  currentMod = null;
  document.getElementById('homeView').style.display = 'block';
  document.getElementById('modView').style.display = 'none';
  buildHome();
  buildSidebar();
  scrollTop();
}

function scrollTop() {
  const main = document.getElementById('main');
  if (main) main.scrollTop = 0;
}

// ── TABS ──
function switchTab(modId, tab) {
  ['lesson','transcript','notes'].forEach(function(t) {
    const pane = document.getElementById('tp-' + t + '-' + modId);
    const btn = document.getElementById('tbl-' + t + '-' + modId);
    if (pane) pane.classList.toggle('hidden', t !== tab);
    if (btn) btn.classList.toggle('active', t === tab);
  });
}
function tabLesson(id) { switchTab(id, 'lesson'); }
function tabTranscript(id) { switchTab(id, 'transcript'); }
function tabNotes(id) { switchTab(id, 'notes'); }

// ── QUIZ ENGINE ──
function buildQuizSection(modId) {
  if (!QB[modId]) return '';
  return '<div class="quiz-section">' +
    '<div class="quiz-lbl">Module Quiz</div>' +
    '<div class="quiz-wrap" id="qz-' + modId + '"><div class="quiz-prog">Loading…</div></div>' +
  '</div>';
}

function startQuiz(modId) {
  const bank = QB[modId];
  if (!bank) return;
  const shuffled = bank.slice().sort(function() { return Math.random() - 0.5; }).slice(0, 4);
  const drawn = shuffled.map(function(q) {
    const opts = q.opts.slice();
    const correctText = opts[q.correct];
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp;
    }
    return { q: q.q, opts: opts, correct: opts.indexOf(correctText), explanation: q.explanation };
  });
  quizState[modId] = { drawn: drawn, current: 0, answers: [] };
  renderQuizQ(modId);
}

function renderQuizQ(modId) {
  const state = quizState[modId];
  if (!state) return;
  const q = state.drawn[state.current];
  const wrap = document.getElementById('qz-' + modId);
  if (!wrap) return;
  const isLast = state.current === state.drawn.length - 1;
  let optsHtml = '';
  q.opts.forEach(function(opt, i) {
    optsHtml += '<div class="quiz-opt" id="qo-' + modId + '-' + i + '" onclick="answerQ(' + sq + modId + sq + ',' + i + ')">' + opt + '</div>';
  });
  wrap.innerHTML =
    '<div class="quiz-prog">Question ' + (state.current + 1) + ' of ' + state.drawn.length + '</div>' +
    '<div class="quiz-q-text">' + q.q + '</div>' +
    '<div class="quiz-opts" id="qopts-' + modId + '">' + optsHtml + '</div>' +
    '<div class="quiz-exp" id="qexp-' + modId + '"></div>' +
    '<button class="btn btn-primary quiz-next" id="qnxt-' + modId + '" style="display:none" onclick="nextQ(' + sq + modId + sq + ')">' +
      (isLast ? 'See Results' : 'Next Question →') +
    '</button>';
}

function answerQ(modId, chosen) {
  const state = quizState[modId];
  if (!state) return;
  const q = state.drawn[state.current];
  const isCorrect = chosen === q.correct;
  q.opts.forEach(function(_, i) {
    const el = document.getElementById('qo-' + modId + '-' + i);
    if (!el) return;
    el.classList.add('locked');
    if (i === q.correct) el.classList.add('correct');
    else if (i === chosen) el.classList.add('wrong');
  });
  const exp = document.getElementById('qexp-' + modId);
  if (exp) {
    exp.textContent = (isCorrect ? '✓ ' : '✗ ') + q.explanation;
    exp.className = 'quiz-exp show ' + (isCorrect ? 'correct' : 'wrong');
  }
  state.answers.push({ chosen: chosen, correct: q.correct, isCorrect: isCorrect });
  setTimeout(function() {
    const btn = document.getElementById('qnxt-' + modId);
    if (btn) btn.style.display = 'inline-block';
  }, 600);
}

function nextQ(modId) {
  const state = quizState[modId];
  if (!state) return;
  state.current++;
  if (state.current >= state.drawn.length) showQuizResults(modId);
  else renderQuizQ(modId);
}

function showQuizResults(modId) {
  const state = quizState[modId];
  if (!state) return;
  const nCorrect = state.answers.filter(function(a) { return a.isCorrect; }).length;
  const passed = nCorrect >= 3;
  if (passed) {
    passedQuizzes.add(modId);
    localStorage.setItem('eng_quizzes', JSON.stringify([...passedQuizzes]));
  }
  const wrap = document.getElementById('qz-' + modId);
  if (!wrap) return;
  let reviewHtml = '';
  state.drawn.forEach(function(q, i) {
    const ans = state.answers[i];
    reviewHtml += '<div class="rv-item ' + (ans.isCorrect ? 'c' : 'w') + '">' +
      '<div class="rv-q">' + (ans.isCorrect ? '✓ ' : '✗ ') + q.q + '</div>' +
      (ans.isCorrect ? '' : '<div class="rv-ans">Your answer: ' + q.opts[ans.chosen] + '</div><div class="rv-correct">Correct: ' + q.opts[q.correct] + '</div>') +
      '<div class="rv-exp">' + q.explanation + '</div></div>';
  });
  wrap.innerHTML =
    '<div class="quiz-result">' +
      '<div class="qr-score ' + (passed ? 'pass' : 'fail') + '">' + nCorrect + '/4 ' + (passed ? '✓ PASS' : '✗ RETRY') + '</div>' +
      '<div class="qr-msg">' + (passed ? 'Quiz passed! You can mark this module complete.' : 'Need 3/4 to pass. Review and try again.') + '</div>' +
      '<div class="qr-review">' + reviewHtml + '</div>' +
      (!passed ? '<button class="btn btn-primary" onclick="startQuiz(' + sq + modId + sq + ')">Retry Quiz</button>' : '') +
    '</div>';
}

// ── COMPLETE ──
function toggleComplete(id) {
  if (completed.has(id)) completed.delete(id);
  else completed.add(id);
  updateProgress();
  buildSidebar();
  const btn = document.getElementById('cbtn-' + id);
  if (btn) {
    btn.textContent = completed.has(id) ? '✓ Complete' : 'Mark Complete';
    btn.classList.toggle('done', completed.has(id));
  }
  buildHome();
}

// ── BOOKMARKS ──
function toggleBookmark(id) {
  if (bookmarks.has(id)) bookmarks.delete(id);
  else bookmarks.add(id);
  localStorage.setItem('eng_bookmarks', JSON.stringify([...bookmarks]));
  buildSidebar();
}

// ── NOTES ──
function saveNotes(id) {
  const ta = document.getElementById('notes-' + id);
  if (!ta) return;
  const val = ta.value;
  const cnt = document.getElementById('nc-' + id);
  if (cnt) cnt.textContent = val.length + ' chars';
  clearTimeout(notesTimer);
  notesTimer = setTimeout(function() { localStorage.setItem('eng_notes_' + id, val); }, 500);
}

// ── SEARCH ──
function openSearch() {
  document.getElementById('searchOv').classList.add('show');
  setTimeout(function() { const el = document.getElementById('searchIn'); if (el) el.focus(); }, 50);
}
function closeSearch() {
  document.getElementById('searchOv').classList.remove('show');
  const el = document.getElementById('searchIn');
  if (el) el.value = '';
  const res = document.getElementById('searchRes');
  if (res) res.innerHTML = '';
}
function runSearch(q) {
  const res = document.getElementById('searchRes');
  if (!res) return;
  if (!q.trim()) { res.innerHTML = ''; return; }
  const lower = q.toLowerCase();
  const hits = SEARCH_IDX.filter(function(m) { return m.title.toLowerCase().indexOf(lower) >= 0 || m.text.indexOf(lower) >= 0; }).slice(0, 8);
  if (!hits.length) { res.innerHTML = '<div class="s-empty">No results for "' + q + '"</div>'; return; }
  let html = '';
  hits.forEach(function(h) {
    const si = h.text.indexOf(lower);
    const snip = si >= 0 ? '…' + h.text.slice(Math.max(0, si - 30), si + 60) + '…' : '';
    html += '<div class="s-hit" onclick="closeSearch();showModule(' + sq + h.id + sq + ')">' +
      '<div class="sh-num">' + h.num + '</div>' +
      '<div><div class="sh-title">' + h.title + '</div>' +
      (snip ? '<div class="sh-snip">' + snip + '</div>' : '') +
      '</div></div>';
  });
  res.innerHTML = html;
}

// ── CERTIFICATE ──
function showCert() { document.getElementById('certOv').classList.add('show'); }
function closeCert() { document.getElementById('certOv').classList.remove('show'); }
function printCert() {
  const name = document.getElementById('certName').value.trim() || 'Student';
  const el = document.getElementById('certRecipient');
  if (el) el.textContent = name;
  closeCert();
  setTimeout(function() { window.print(); }, 100);
}

// ── CODE COPY ──
function copyCode(btn) {
  const pre = btn.closest('.code-block').querySelector('pre');
  if (!pre) return;
  navigator.clipboard.writeText(pre.textContent).then(function() {
    btn.textContent = '✓ copied';
    setTimeout(function() { btn.textContent = 'copy'; }, 2000);
  }).catch(function() {});
}

// ── MOBILE NAV ──
function openMob() {
  const d = document.getElementById('mobDraw');
  const o = document.getElementById('mobOv');
  if (!d) return;
  const topEl = document.querySelector('.sb-top');
  const topClone = topEl ? topEl.cloneNode(true) : document.createElement('div');
  d.innerHTML = '';
  d.appendChild(topClone);
  const navDiv = document.createElement('div');
  navDiv.className = 'sb-nav';
  d.appendChild(navDiv);
  buildSidebar(navDiv);
  d.classList.add('show');
  if (o) o.classList.add('show');
}
function closeMob() {
  const d = document.getElementById('mobDraw');
  const o = document.getElementById('mobOv');
  if (d) d.classList.remove('show');
  if (o) o.classList.remove('show');
}

// ── KEYBOARD NAV ──
document.addEventListener('keydown', function(e) {
  if (document.activeElement && (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT')) return;
  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (e.key === 'Escape') { closeSearch(); closeCert(); return; }
  if (!currentMod) return;
  const idx = MODULES.findIndex(function(m) { return m.id === currentMod; });
  if (e.key === 'ArrowRight' && idx < MODULES.length - 1) showModule(MODULES[idx + 1].id);
  if (e.key === 'ArrowLeft' && idx > 0) showModule(MODULES[idx - 1].id);
});

// ── INIT ──
updateProgress();
buildSidebar();
buildHome();

</script>
