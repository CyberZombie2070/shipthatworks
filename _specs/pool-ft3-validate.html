```javascript
function validatePassword(password) {
  const failed = [];

  if (password.length < 8) {
    failed.push("Must be at least 8 characters long");
  }
  if (!/[0-9]/.test(password)) {
    failed.push("Must contain a number");
  }
  if (!/[A-Z]/.test(password)) {
    failed.push("Must contain an uppercase letter");
  }

  return {
    passed: failed.length === 0,
    failedRules: failed,
  };
}

// Example 1: passes all rules
console.log(validatePassword("Hello123"));
// { passed: true, failedRules: [] }

// Example 2: too short and no number
console.log(validatePassword("Abc"));
// { passed: false, failedRules: [
//     "Must be at least 8 characters long",
//     "Must contain a number"
//   ] }

// Example 3: long enough with a number, but no uppercase
console.log(validatePassword("lowercase99"));
// { passed: false, failedRules: ["Must contain an uppercase letter"] }
```

A few notes on the design:

The function returns `passed` (a boolean) plus `failedRules` (an array of human-readable strings), so a caller can both branch on success and show the user exactly what to fix. When the password is valid, `failedRules` is empty.

Each check is independent, so a password can fail multiple rules at once, as in example 2. If you'd rather have machine-readable keys than display strings (e.g. for translating messages or styling individual requirements in a UI), you could push codes like `"length"`, `"number"`, `"uppercase"` instead, or return an object mapping each rule name to a boolean. Let me know if you'd like that variant.
